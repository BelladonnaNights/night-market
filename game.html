<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Night Market</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#0e0916;--card:#1b1327;--card2:#251a35;--line:rgba(240,198,116,.16);--line2:rgba(240,198,116,.42);--gold:#f0c674;--amber:#e8a33d;--plum:#8a5aae;--text:#f2e9db;--muted:#ab9ec0;--faint:#7d7092;--ok:#7fc8a0;--bad:#e58585;
--serif:'Cormorant Garamond','Cormorant',Georgia,serif;--sans:'Nunito Sans','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}input,select,textarea{font:inherit;color:var(--text)}
#game{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}
.hud{position:relative;z-index:20;display:flex;gap:10px;align-items:center;padding:10px 16px;background:linear-gradient(180deg,rgba(14,9,22,.92),rgba(14,9,22,.55));border-bottom:1px solid var(--line);flex-wrap:wrap}
.hud .brand{font:700 22px var(--serif);color:var(--gold);margin-right:6px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 13px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:700;font-size:13.5px;white-space:nowrap}
.pill b{color:var(--gold);font-family:var(--serif);font-size:18px;font-weight:700}
.sp{flex:1}
.ibtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--gold)}
.ibtn:hover{border-color:var(--line2);background:rgba(240,198,116,.1)}
#main{position:relative;overflow:hidden;min-height:0}
#artback,#artfront{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#artfront{z-index:4}
.cust{position:absolute;left:50%;bottom:21%;transform:translateX(-50%);z-index:3;width:min(40vh,62vw);transition:.5s}
.cust.in{animation:walkin .6s ease-out}
@keyframes walkin{from{opacity:0;transform:translateX(-30%)}to{opacity:1;transform:translateX(-50%)}}
.speech{position:absolute;z-index:6;left:50%;top:4%;transform:translateX(-50%);width:min(620px,92%);padding:16px 22px;border-radius:20px;background:linear-gradient(160deg,rgba(43,31,63,.96),rgba(26,18,38,.96));border:1px solid var(--line2);box-shadow:0 18px 50px rgba(0,0,0,.5)}
.speech .who{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.speech .nm{font:700 24px var(--serif)}
.speech .q{font:italic 500 21px/1.35 var(--serif);color:#eadff7}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font:800 11px var(--sans);letter-spacing:.04em;color:var(--c,var(--gold));border:1px solid color-mix(in srgb,var(--c,var(--gold)) 40%,transparent);background:color-mix(in srgb,var(--c,var(--gold)) 12%,transparent)}
.tray{position:absolute;z-index:6;left:0;right:0;bottom:0;padding:12px 16px 14px;background:linear-gradient(0deg,rgba(14,9,22,.96) 70%,rgba(14,9,22,0));display:grid;gap:10px}
.trayrow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;align-items:stretch}
.lbl{font:800 10px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.item{--c:var(--gold);flex:none;min-width:116px;max-width:170px;padding:8px 12px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,var(--card2),var(--card));text-align:left;transition:.15s;position:relative}
.item:hover{border-color:var(--line2);transform:translateY(-2px)}
.item.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(240,198,116,.25),0 0 20px rgba(240,198,116,.2)}
.item .n{font:700 17px/1.1 var(--serif)}
.item .t{font-size:11.5px;color:var(--muted)}
.item .c{position:absolute;right:8px;top:6px;font:700 13px var(--serif);color:var(--gold)}
.item.dis{opacity:.45}
.tier{font:800 9.5px var(--sans);letter-spacing:.12em;text-transform:uppercase}
.tier.Improper{color:#d6a05a}.tier.Proper{color:#9fc7a8}.tier.Fine{color:#8ec9e8}.tier.Perfect{color:#e8a0e0}.tier.Ruined{color:#a06060}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:99px;font-weight:800;font-size:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);white-space:nowrap}
.btn:hover{border-color:var(--line2);background:rgba(240,198,116,.1)}
.btn.gold{border:0;color:#2a1a08;background:linear-gradient(135deg,#f6d98c,#e8a33d);box-shadow:0 6px 22px rgba(232,163,61,.28)}
.btn.gold:hover{filter:brightness(1.07)}
.btn.sm{height:32px;padding:0 13px;font-size:13px}
.btn.off{opacity:.4;pointer-events:none}
.btn.danger{color:var(--bad);border-color:rgba(229,133,133,.35)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dock{position:relative;z-index:20;display:flex;gap:8px;justify-content:center;padding:10px 12px;background:linear-gradient(0deg,rgba(14,9,22,.95),rgba(14,9,22,.6));border-top:1px solid var(--line);flex-wrap:wrap}
.dock .btn{height:42px}
.dock .btn.on{background:rgba(240,198,116,.16);border-color:var(--line2);color:var(--gold)}
.center{position:absolute;z-index:6;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;width:min(560px,92%)}
.center h2{font:700 clamp(34px,5vw,54px)/1 var(--serif);margin:0 0 8px;background:linear-gradient(180deg,#fff3d6,#f0c674 70%,#d99a3e);-webkit-background-clip:text;background-clip:text;color:transparent}
.center p{color:#d5c9e5;font-size:17px;margin:0 0 16px}
.quest{position:absolute;z-index:7;left:14px;top:12px;width:min(280px,60vw);padding:12px 14px;border-radius:16px;background:rgba(14,9,22,.82);border:1px solid var(--line);backdrop-filter:blur(6px)}
.quest h4{margin:0 0 6px;font:700 19px var(--serif);color:var(--gold);display:flex;justify-content:space-between}
.quest li{list-style:none;display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--muted);padding:2px 0}
.quest li i{flex:none;width:15px;height:15px;border-radius:5px;border:1.5px solid var(--line2);margin-top:3px;display:grid;place-items:center;font-style:normal;font-size:11px;color:#2a1a08}
.quest li.done{color:var(--faint);text-decoration:line-through}.quest li.done i{background:var(--gold)}
.speech ~ .quest{display:none}
/* overlays */
#overlay:empty,#story:empty{display:none}
.scrim{position:fixed;inset:0;z-index:100;background:rgba(8,5,14,.76);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.modal{width:min(880px,100%);border-radius:24px;background:linear-gradient(165deg,#2b1f3f,#1a1226 55%);border:1px solid var(--line2);box-shadow:0 40px 120px rgba(0,0,0,.65);padding:26px 28px;position:relative;animation:rise .22s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.modal.narrow{width:min(560px,100%)}
.modal h2{font:700 38px/1 var(--serif);margin:0 0 4px}
.modal .x{position:absolute;right:16px;top:16px}
.eyebrow{font:800 11px var(--sans);letter-spacing:.28em;color:var(--gold);text-transform:uppercase}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:13px}
.tab.on{background:var(--gold);color:#2a1a08;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rcard{--c:var(--gold);padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,var(--card2),var(--card));position:relative;overflow:hidden}
.rcard::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--c),transparent 80%)}
.rcard h4{font:700 21px/1.1 var(--serif);margin:0 0 4px}
.rcard p{margin:4px 0;color:var(--muted);font-size:13.5px}
.rcard.lock{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chip{padding:2px 9px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);font:700 12px var(--sans)}
.chip.have{border-color:rgba(127,200,160,.5);color:var(--ok)}.chip.miss{border-color:rgba(229,133,133,.4);color:var(--bad)}
.safety{padding:8px 11px;border-radius:10px;background:rgba(229,133,133,.08);border:1px solid rgba(229,133,133,.25);color:#f0c8c8;font-size:12.5px;margin-top:6px}
.fld{display:grid;gap:4px;margin:8px 0}.fld label{font:800 10px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.fld input,.fld select{padding:8px 11px;border-radius:10px;background:rgba(14,9,22,.6);border:1px solid var(--line);outline:0;min-width:0}
.fld input:focus,.fld select:focus{border-color:var(--gold)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.adm{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.adm section{padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.adm h3{margin:0 0 6px;font:700 22px var(--serif);color:var(--gold)}
.note{padding:10px 13px;border-radius:12px;background:rgba(240,198,116,.06);border:1px solid var(--line);color:#e4d8c5;font-size:13.5px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);z-index:300;padding:10px 20px;border-radius:99px;background:#2d2142;border:1px solid var(--line2);color:var(--gold);font-weight:800;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.gain{position:absolute;z-index:9;left:50%;top:44%;transform:translateX(-50%);font:700 46px var(--serif);color:var(--gold);text-shadow:0 0 24px rgba(240,198,116,.7);animation:gain 1.4s ease-out forwards;pointer-events:none}
@keyframes gain{from{opacity:0;transform:translate(-50%,20px)}20%{opacity:1}to{opacity:0;transform:translate(-50%,-60px)}}
/* story */
#story{position:fixed;inset:0;z-index:150;background:#000}
.vn-bg{position:absolute;inset:0}
.vn-bg svg{width:100%;height:100%;display:block}
.vn-char{position:absolute;bottom:0;height:78%;transition:.4s;display:flex;align-items:flex-end}
.vn-char.left{left:6%}.vn-char.right{right:6%}.vn-char.center{left:50%;transform:translateX(-50%)}
.vn-char svg{height:100%;width:auto}.vn-char.dim{filter:brightness(.55)}
.vn-box{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);width:min(940px,95%);min-height:150px;padding:20px 28px 18px;border-radius:22px;background:linear-gradient(160deg,rgba(43,31,63,.96),rgba(22,15,32,.97));border:1px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,.6);cursor:pointer}
.vn-name{position:absolute;left:24px;top:-17px;padding:4px 18px;border-radius:99px;font:700 22px var(--serif);background:linear-gradient(135deg,#f6d98c,#e8a33d);color:#2a1a08;box-shadow:0 6px 20px rgba(232,163,61,.3)}
.vn-text{font:500 22px/1.45 var(--serif);color:#f2e9db;min-height:64px;white-space:pre-wrap}
.vn-text.narr{color:#cdbfe0;font-style:italic}
.vn-next{position:absolute;right:20px;bottom:10px;color:var(--gold);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
.vn-choices{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:min(640px,92%);display:grid;gap:10px;z-index:5}
.vn-choice{padding:14px 20px;border-radius:16px;text-align:left;font:600 20px var(--serif);background:linear-gradient(160deg,rgba(43,31,63,.97),rgba(26,18,38,.97));border:1px solid var(--line2);transition:.15s}
.vn-choice:hover{border-color:var(--gold);transform:translateX(4px);background:rgba(240,198,116,.12)}
.vn-tools{position:absolute;right:14px;top:12px;display:flex;gap:8px;z-index:6}
.fly{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe3a0;box-shadow:0 0 10px 3px rgba(255,214,130,.55);opacity:0;animation:flya var(--d) ease-in-out var(--dl) infinite}
@keyframes flya{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}50%{opacity:.35;transform:translate(var(--x),var(--y))}85%{opacity:.9}100%{opacity:0}}
.glow{animation:glow 3.2s ease-in-out infinite}@keyframes glow{50%{opacity:.7}}
@media (max-width:700px){.hud .brand{display:none}.vn-text{font-size:19px}.vn-char{height:62%}.item{min-width:100px}.speech .q{font-size:18px}}

@keyframes pulse{0%,100%{transform:scale(.85);opacity:.8}50%{transform:scale(1.15);opacity:1}}

/* ---- stage (scene layers) ---- */
.stage{position:absolute;inset:0;overflow:hidden}
.stage .st{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden}
.stage.edit{position:relative;inset:auto;margin:auto;box-shadow:0 0 0 1px var(--line2),0 20px 60px rgba(0,0,0,.5)}
.stage.edit .st{left:0;top:0}
.ly{position:absolute;transform-origin:center}
.ly .lyi{display:block;transform-origin:center;max-width:none}
.stage.edit .ly{cursor:grab}.stage.edit .ly.sel{outline:2px solid #f0c674;outline-offset:2px}
.stage.edit .guide{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(240,198,116,.25)}
@keyframes fxpulse{0%,100%{opacity:calc(1 - var(--a)*.65);transform:scale(calc(1 - var(--a)*.1))}50%{opacity:1;transform:scale(calc(1 + var(--a)*.14))}}
@keyframes fxflick{0%,100%{opacity:1}8%{opacity:calc(1 - var(--a)*.4)}14%{opacity:1}26%{opacity:calc(1 - var(--a)*.7)}38%{opacity:.95}52%{opacity:calc(1 - var(--a)*.5)}70%{opacity:1}84%{opacity:calc(1 - var(--a)*.6)}}
@keyframes fxsway{0%,100%{transform:rotate(calc(var(--a)*-7deg))}50%{transform:rotate(calc(var(--a)*7deg))}}
@keyframes fxfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--a)*-26px))}}
@keyframes fxspin{to{transform:rotate(360deg)}}
@keyframes fxtwk{0%,100%{opacity:1;transform:scale(1)}50%{opacity:calc(1 - var(--a)*.9);transform:scale(calc(1 - var(--a)*.3))}}
.fx-pulse{animation:fxpulse var(--d) ease-in-out infinite}.fx-flicker{animation:fxflick calc(var(--d)*1.4) linear infinite}
.fx-sway{animation:fxsway var(--d) ease-in-out infinite;transform-origin:50% 0!important}.fx-float{animation:fxfloat calc(var(--d)*1.5) ease-in-out infinite}
.fx-spin{animation:fxspin calc(var(--d)*8) linear infinite}.fx-twinkle{animation:fxtwk calc(var(--d)*.6) ease-in-out infinite}
.flies{position:relative}.flies i{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 14px 5px var(--c);animation:ffd 8s ease-in-out infinite,ffb 3s ease-in-out infinite}
@keyframes ffd{0%,100%{transform:translate(0,0)}25%{transform:translate(40px,-30px)}50%{transform:translate(-20px,-60px)}75%{transform:translate(-45px,-20px)}}
@keyframes ffb{0%,100%{opacity:.15}50%{opacity:1}}
/* ---- asset manager ---- */
#asm{position:fixed;inset:0;z-index:200;background:#0b0712;display:flex;flex-direction:column;color:var(--ink,#f6e8c8);font-family:var(--sans)}
.am-top{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.am-t{font:700 20px var(--serif);color:var(--gold)}.am-sp{flex:1}
.am-body{flex:1;display:grid;grid-template-columns:minmax(260px,320px) 1fr minmax(260px,320px);min-height:0}
.am-tree,.am-right{overflow:auto;padding:8px;background:rgba(20,13,32,.6)}.am-tree{border-right:1px solid var(--line)}.am-right{border-left:1px solid var(--line)}
.am-mid{display:flex;flex-direction:column;min-width:0;min-height:0;padding:10px;gap:8px}
.am-stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#05030a;border-radius:12px;overflow:hidden}
.am-prev{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#05030a;border-radius:12px;padding:12px}
.am-sbar{display:flex;gap:10px;align-items:center;font-size:13px}.am-empty{color:var(--muted);font-size:13px;padding:10px}.am-empty.big{font-size:16px;text-align:center;margin:auto;max-width:420px}
.tr{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:9px;cursor:pointer;font-size:13.5px;border:1px solid transparent;position:relative}
.tr:hover{background:rgba(240,198,116,.07)}.tr.on{background:rgba(240,198,116,.16);border-color:var(--line2)}.tr.cur{background:rgba(201,160,220,.12)}
.tr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tr .cnt,.tr .tag{font-size:11px;color:var(--muted)}.tr .th{width:28px;height:28px;object-fit:contain;border-radius:5px;background:#05030a}.tr .ico{width:28px;text-align:center;color:var(--gold);font-style:normal}
.tr .car{width:14px;cursor:pointer}.tr .tact{display:none;gap:3px}.tr.f:hover .tact{display:flex}.tr .tact button{font:700 10.5px var(--sans);padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.08);color:inherit;border:0;cursor:pointer}.tr .tact button:hover{background:var(--gold);color:#1a1226}
.tr.dropt{outline:2px solid var(--gold);background:rgba(240,198,116,.18)}.tr.dropb{box-shadow:0 2px 0 0 var(--gold)}.tr.root{font-weight:700;color:var(--gold)}
.am-p{padding:6px}.am-p h3{font:700 17px var(--serif);color:var(--gold);margin:12px 0 6px}.am-p p{font-size:13px;color:var(--muted);line-height:1.5}.am-p code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px}
.am-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.am-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.am-p .fld{margin:8px 0}.am-p .fld label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.am-p input[type=text],.am-p input[type=number],.am-p input:not([type]),.am-p select{width:100%;padding:6px 9px;border-radius:9px;background:rgba(14,9,22,.7);border:1px solid var(--line);color:inherit;font:inherit;outline:0}
.rng{display:flex;gap:8px;align-items:center}.rng input[type=range]{flex:1}.rng input[type=number]{width:74px!important}
.lrows{max-height:200px;overflow:auto}.lrow{display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:13px}.lrow.on{background:rgba(240,198,116,.16)}.lrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lrow button{background:none;border:0;color:inherit;cursor:pointer;opacity:.7;font-size:14px}
@media(max-width:900px){.am-body{grid-template-columns:1fr}.am-tree{max-height:30vh}.am-right{max-height:34vh}}

.pstage{position:relative;aspect-ratio:2/3}.cust .pstage{width:100%}.vn-char .pstage{height:100%}

.iart{object-fit:contain;display:inline-block;pointer-events:none}.iart.lg{float:right;width:56px;height:56px;margin:0 0 6px 10px}.item .iart.tray{display:block;width:46px;height:46px;margin:0 auto 4px}

.cmwrap{width:min(900px,100%);border-radius:24px;background:linear-gradient(165deg,#2b1f3f,#1a1226 55%);border:1px solid var(--line2);box-shadow:0 40px 120px rgba(0,0,0,.65);padding:16px 18px 14px;animation:rise .22s cubic-bezier(.2,.8,.2,1)}
.cmhead{text-align:center;margin-bottom:8px}.cmhead h2{margin:2px 0 2px;font-size:30px}.cmhead .note{margin:0;min-height:20px}
#cmc{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--line2);touch-action:none;cursor:crosshair;background:#0c0714}
.cmfoot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}.cmfoot .am-sp{flex:1}

/* customers match the time of day */
.cust.ph-night{filter:url(#nmnight) saturate(.9) drop-shadow(0 0 2px rgba(12,6,24,.7)) drop-shadow(0 0 7px rgba(12,6,24,.3))}
.cust.ph-dusk{filter:url(#nmdusk) drop-shadow(0 0 2px rgba(12,6,24,.45))}
.cust img{transform:scaleX(var(--flip,1))}

.wscrim{background:#000}.wscrim .wbg{position:absolute;inset:0;z-index:0;overflow:hidden}.wscrim .wbg .stage{position:absolute;inset:0}.wscrim .modal{position:relative;z-index:1;background:rgba(14,9,22,.88);backdrop-filter:blur(3px)}

/* ===== Almanac: book of shadows ===== */

<script type="text/plain" id="scenes">=== arrival
@bg market_dusk
narrator: The token is warm in your hand. It has been warm since the road bent toward the town, though the evening is cold.
narrator: You did not expect a market. The town looked asleep. But as the last light goes, lanterns open one by one along the canal, and stalls you could swear were not there are suddenly there, and open.
narrator: At the far end, one stall has no lantern at all. Its counter is bare wood. A woman stands beside it as if she has been waiting a very long time.
@show wren right
wren: You have her token.
@show player left
player: It was my parent's. They never said a word about a market.
wren: No. They wouldn't have.
wren: Your parent and I were friends. For a very long time.

+ "Ask about my parent" -> parent
+ "Say nothing. Look at the stall." -> stall
:what
wren: The market keeps its own hours. It likes company. It likes to be remembered.
wren: That is all anyone has ever managed to tell me, and I have kept it longer than most.
@goto cont
:parent
wren: They came once, after their partner died. They left with the token and a promise to come back.
wren: They did not manage it. I am sorry.
@rel wren 1
@goto cont
:stall
wren: Stall Thirteen. It is yours, if you want it.
@set arrival_silent
@goto cont
:cont
wren: The habits your parent gave you. The herbs, the wax, the quiet work with your hands. They are the whole trade here.
wren: Gather what you can. Make a candle. Come back when the lanterns are full.
@set met_wren
@end

  return `<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice"><defs><linearGradient id="mk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#08141a"/><stop offset=".6" stop-color="#143a3a"/><stop offset="1" stop-color="#0b2420"/></linearGradient></defs><rect width="1600" height="900" fill="url(#mk)"/><circle cx="1180" cy="170" r="60" fill="#e8f2d8" opacity=".85"/>${reeds}<ellipse cx="800" cy="860" rx="900" ry="120" fill="#0c3030" opacity=".8"/>${[0,1,2,3,4].map(i=>`<circle class="glow" cx="${300+i*260}" cy="${640+(i%2)*40}" r="9" fill="#bff5d8"/><circle cx="${300+i*260}" cy="${640+(i%2)*40}" r="38" fill="#7fe0b8" opacity=".12"/>`).join('')}</svg>`;}
function bgArt(name){
  if(name==='wrens_corner'&&!slotScene('bg_wrens_corner'))name='market_dusk';
  const bsid=slotScene('bg_'+name);if(bsid)return stageHtml(bsid,S.phase||'night');
  if(ART.bg[name])return `<img src="${ART.bg[name]}" style="width:100%;height:100%;object-fit:cover" alt="">`;
  if(name==='marsh_night')return marshBack();
  if(name==='black')return '<div style="background:#000;width:100%;height:100%"></div>';
  const ph=name==='market_dusk'?'dusk':name==='market_day'?'day':'night';
  return stallBack(ph,moonOf(S.day))+'<div style="position:absolute;inset:0">'+stallFront(ph)+'</div>';
}
function fireflies(n){let h='';for(let i=0;i<n;i++)h+=`<span class="fly" style="left:${Math.random()*100}%;top:${30+Math.random()*60}%;--x:${(Math.random()*120-60)|0}px;--y:${(Math.random()*-110-20)|0}px;--d:${9+Math.random()*9}s;--dl:${-Math.random()*14}s"></span>`;return h;}

/* ===== story-scene engine (visual novel) =====
Script format (one block per scene):
  === scene_id
  @bg market_dusk | market_day | stall | marsh_night | black
  @show wren right|left|center     @hide wren     @dim wren
  wren: A line of dialogue.        (no "name:" = narration; {p} = player name)
  + "A choice" -> label            (consecutive + lines make one menu; add  if flag / ifnot flag)
  :label                           @goto label     @end
  @set flag [value]  @unset flag   @rel wren 1     @give "Wax Ends" 2 [Tier]   @coins 5
  @if flag -> label   @ifnot flag -> label
*/
function parseScenes(txt){
  const out={};let cur=null;
  txt.split(/\r?\n/).forEach(raw=>{
    const line=raw.trim();if(!line||line.startsWith('//'))return;
    let m=line.match(/^===\s*(\S+)/);if(m){cur=out[m[1]]={id:m[1],lines:[],labels:{}};return;}
    if(!cur)return;
    if(line.startsWith(':')){cur.labels[line.slice(1).trim()]=cur.lines.length;return;}
    if(line.startsWith('@')){const p=line.slice(1).match(/"[^"]*"|\S+/g)||[];cur.lines.push({t:'cmd',c:p[0],a:p.slice(1).map(x=>x.replace(/^"|"$/g,''))});return;}
    if(line.startsWith('+')){m=line.match(/^\+\s*"([^"]+)"\s*->\s*(\S+)(?:\s+(if|ifnot)\s+(\S+))?/);if(m)cur.lines.push({t:'ch',text:m[1],to:m[2],cond:m[3],flag:m[4]});return;}
    m=line.match(/^([A-Za-z_][\w ]{0,24}):\s+(.*)$/);
    if(m)cur.lines.push({t:'say',who:m[1].trim().toLowerCase(),text:m[2]});else cur.lines.push({t:'say',who:'narrator',text:line});
  });
  return out;
}
let SCENES={};
const subst=t=>String(t).replace(/\{p\}/g,PLAYER());
let VN=null;
function playScene(id,onEnd){
  const sc=SCENES[id];if(!sc){toast('No scene: '+id);onEnd&&onEnd();return;}
  VN={sc,i:0,bg:'black',chars:{},typing:null,done:false,onEnd,wait:null};
  const root=$('#story');
  root.innerHTML=`<div class="vn-bg" id="vnbg"></div><div id="vnflies" style="position:absolute;inset:0;pointer-events:none">${fireflies(14)}</div><div id="vnchars"></div>
   <div class="vn-tools"><button class="btn sm" data-vn="skip">Skip scene</button></div>
   <div class="vn-choices" id="vnch" style="display:none"></div>
   <div class="vn-box" id="vnbox" data-vn="adv"><div class="vn-name" id="vnname"></div><div class="vn-text" id="vntext"></div><div class="vn-next">▼</div></div>`;
  S.scenesSeen[id]=true;vnStep();
}
function vnRenderChars(){
  $('#vnchars').innerHTML=Object.entries(VN.chars).map(([cid,v])=>`<div class="vn-char ${v.pos} ${v.dim?'dim':''}">${portrait(castFor(cid))}</div>`).join('');fitStages();
}
function vnSay(who,text){
  const c=who==='narrator'?null:castFor(who);
  const nm=$('#vnname'),tx=$('#vntext');
  nm.style.display=c?'block':'none';if(c)nm.textContent=c.name;
  tx.className='vn-text'+(c?'':' narr');
  Object.keys(VN.chars).forEach(k=>{VN.chars[k].dim=c?(k!==c.id&&k!==who):false;});vnRenderChars();
  const full=subst(text);tx.textContent='';let n=0;const sp=S.textSpeed||26;
  clearInterval(VN.typing);VN.full=full;
  VN.typing=setInterval(()=>{n++;tx.textContent=full.slice(0,n);if(n>=full.length){clearInterval(VN.typing);VN.typing=null;}},sp);
}
function vnFinishTyping(){if(VN.typing){clearInterval(VN.typing);VN.typing=null;$('#vntext').textContent=VN.full;return true;}return false;}
function vnJump(l){const sc=VN.sc;if(l in sc.labels)VN.i=sc.labels[l];else{console.warn('missing label',l);VN.i=sc.lines.length;}}
function vnStep(){
  const sc=VN.sc;
  while(VN.i<sc.lines.length){
    const L=sc.lines[VN.i];
    if(L.t==='say'){VN.i++;vnSay(L.who,L.text);return;}
    if(L.t==='ch'){
      const opts=[];while(VN.i<sc.lines.length&&sc.lines[VN.i].t==='ch'){const c=sc.lines[VN.i++];
        if(c.cond==='if'&&!flag(c.flag))continue;if(c.cond==='ifnot'&&flag(c.flag))continue;opts.push(c);}
      const box=$('#vnch');box.style.display='grid';
      box.innerHTML=opts.map((o,ix)=>`<button class="vn-choice" data-vn="pick" data-to="${esc(o.to)}">${esc(subst(o.text))}</button>`).join('');
      $('#vnbox').style.visibility='hidden';return;}
    if(L.t==='cmd'){VN.i++;if(vnCmd(L)==='end')return;continue;}
    VN.i++;
  }
  vnEnd();
}
function vnCmd(L){
  const a=L.a;
  switch(L.c){
    case'bg':VN.bg=a[0];$('#vnbg').innerHTML=bgArt(a[0]);fitStages();break;
    case'show':VN.chars[(a[0]||'').toLowerCase()]={pos:a[1]||'right',dim:false};vnRenderChars();break;
    case'hide':delete VN.chars[(a[0]||'').toLowerCase()];vnRenderChars();break;
    case'dim':if(VN.chars[a[0]])VN.chars[a[0]].dim=true;vnRenderChars();break;
    case'set':S.flags[a[0]]=a[1]!==undefined?(isNaN(a[1])?a[1]:Number(a[1])):true;break;
    case'unset':delete S.flags[a[0]];break;
    case'rel':S.rel[a[0]]=(S.rel[a[0]]||0)+Number(a[1]||1);break;
    case'give':addItem(a[0],Number(a[1]||1),a[2]);toast('Received '+(a[1]||1)+' × '+a[0]);break;
    case'coins':S.coins+=Number(a[0]||0);break;
    case'goto':vnJump(a[0]);break;
    case'if':if(flag(a[0]))vnJump(a[a.length-1]);break;
    case'ifnot':if(!flag(a[0]))vnJump(a[a.length-1]);break;
    case'end':vnEnd();return'end';
  }
}
function vnEnd(){
  if(VN.done)return;VN.done=true;clearInterval(VN.typing);
  const cb=VN.onEnd;VN=null;$('#story').innerHTML='';save();cb&&cb();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-vn]');if(!t||!VN)return;
  const a=t.dataset.vn;
  if(a==='adv'){if(!vnFinishTyping())vnStep();}
  else if(a==='pick'){$('#vnch').style.display='none';$('#vnbox').style.visibility='visible';vnJump(t.dataset.to);vnStep();}
  else if(a==='skip'){vnEnd();}
});
document.addEventListener('keydown',e=>{
  if(!VN)return;
  if((e.key===' '||e.key==='Enter')&&$('#vnch').style.display==='none'){e.preventDefault();if(!vnFinishTyping())vnStep();}
});

/* ===== game: HUD, stall counter, bench, almanac, flow ===== */
const PHASES={day:{label:'Day',icon:'☀'},dusk:{label:'Dusk',icon:'◐'},night:{label:'Night',icon:'☾'}};
const KINDCOLOR=k=>k==='Walk-in'?'#c9b6e8':listColor('reqkinds',k);
function sel(){return S.tmp.sel||(S.tmp.sel=[]);}

/* ---------- flow ---------- */
function toggleFS(){try{if(!document.fullscreenElement)(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen).call(document.documentElement);else (document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}}
function setPhase(p){S.phase=p;S.tmp.dawn=0;if(p!=='night'){S.queue=[];S.cur=null;}S.tmp.sel=[];save();render();}
function advanceDay(){S.day++;S.phase='day';S.tmp.dawn=1;S.queue=[];S.cur=null;S.tmp.sel=[];save();render();toast('Day '+S.day+' · '+moonOf(S.day)+' moon');}
function checkLevel(){let n=1;LEVEL_EARN.forEach((t,i)=>{if(S.earned>=t)n=i+1;});n=Math.min(n,D.levels.length||5);if(n>S.level){S.level=n;toast('Stall level up: '+lvName(n));}}
function makeCustomer(r){return {id:r.id,name:r.name,kind:r.kind,level:r.level,ask:r.ask,answer:r.answer,pay:r.pay,wrong:r.wrong,walkin:false};}
const FU_GENERIC={Ailment:['It worked. I slept straight through, first time in weeks.','Whatever was in that, the ache is gone. I came to say so.','Three days and I am a new person. Thank you.'],Wish:['The wish came true, or near enough. I wanted you to know.','Something turned my way the very next morning.','Luck, at last. I brought you nothing but my thanks.'],Favor:['It did what they needed. They sent me with a word of thanks.','The favor is done, and well done.'],Worry:['I stood up and did it. My hands barely shook.','The worry has loosened its grip. Thank you.']};
function thanksFor(f){const r=D.requests.find(x=>x.id===f.rid),c=D.crafts.find(x=>x.name===f.craft);if(!r)return null;
  const own=String((c&&c.outcomes)||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const pool=own.length?own:(FU_GENERIC[r.kind]||FU_GENERIC.Ailment);
  return {id:r.id,name:r.name,kind:'Thanks',level:r.level,ask:rnd(pool),answer:'',pay:Math.max(1,Math.round(r.pay*.25)),wrong:'',walkin:false,thanks:true};}
function walkIn(){
  const goods=D.crafts.filter(c=>c.sells&&c.price>0&&c.level<=S.level);if(!goods.length)return null;
  const g=rnd(goods);const who=rnd(['A passing lamplighter','A veiled traveler','A market child','Two sisters','A tired porter','A sleepy cat-keeper','A lantern-seller','A canal boatwoman']);
  return {id:'walkin-'+Math.random().toString(36).slice(2,7),name:who,kind:'Walk-in',level:g.level,ask:`I will take a ${g.name}, if you have one.`,answer:g.name,pay:g.price,wrong:'',walkin:true};
}
function buildQueue(){
  if(!flag('night_one_done')&&S.day===1){const m=D.requests.find(r=>/moth/i.test(r.name));return m?[makeCustomer(m)]:[];}
  const pool=D.requests.filter(r=>r.level<=S.level&&!(S.lastSeen[r.id]>=S.day-1));
  const q=[];const due=(S.follow||[]).filter(f=>f.due<=S.day);S.follow=(S.follow||[]).filter(f=>f.due>S.day);due.forEach(f=>{const t=thanksFor(f);if(t)q.unshift(t);});const want=2+S.level;const sh=pool.slice().sort(()=>Math.random()-.5);
  while(q.length<want&&sh.length){q.push(makeCustomer(sh.pop()));if(Math.random()<.4){const w=walkIn();if(w)q.push(w);}}
  return q;
}
function openStall(){S.phase='night';S.queue=buildQueue();S.cur=null;S.tmp.sel=[];nextCustomer();save();}
function nextCustomer(){
  S.cur=S.queue.shift()||null;S.tmp.sel=[];S.tmp.react=null;S.tmp.fresh=true;
  if(S.cur)S.lastSeen[S.cur.id]=S.day;
  if(S.cur&&S.cur.thanks){const t=S.cur;S.coins+=t.pay;S.earned+=t.pay;checkLevel();S.tmp.react={line:t.ask,pay:t.pay,correct:true};}
  render();
  if(S.cur&&S.cur.thanks){const g=document.createElement('div');g.className='gain';g.textContent='+'+S.cur.pay;$('#main').appendChild(g);}
}
function closeNight(){
  S.queue=[];S.cur=null;
  const fin=()=>advanceDay();
  if(!flag('night_one_done')&&flag('moth_served'))playScene('night_one_end',()=>{fin();});else fin();
}
function offer(){
  const c=S.cur;if(!c||!sel().length)return;
  const keys=sel();const names=keys.map(k=>k.split('|')[0]);
  const need=parseIng(c.answer).map(p=>p.name.toLowerCase()).sort();
  const got=[...new Set(names.map(n=>n.toLowerCase()))].sort();
  const correct=need.length===got.length&&need.every((n,i)=>n===got[i]);
  const tier=keys.map(k=>k.split('|')[1]).sort((a,b)=>tierRank(a)-tierRank(b))[0]||'Proper';
  const strict=S.mode==='almanac'&&(S.strict[c.kind]!==false);
  let pay=0,line='';
  if(correct){pay=Math.max(1,Math.round(c.pay*tierMult(tier)));
    line=({Improper:'It will do. Not your best.',Proper:'Yes. That is just right.',Fine:'Oh, that is lovely.',Perfect:'I... how did you make this?'})[tier]||'Thank you.';}
  else if(!strict){pay=Math.max(1,Math.round(c.pay*tierMult('Improper')*0.5));line='Not what I came for, but I will take it.';}
  else{line=c.wrong&&c.wrong.length<90?c.wrong:'No. That is not what I need.';}
  if(pay>0){keys.forEach(k=>{const [n,t]=k.split('|');S.inv[k]=(S.inv[k]||0);});
    const cnt={};keys.forEach(k=>cnt[k]=(cnt[k]||0)+1);Object.keys(cnt).forEach(k=>{S.inv[k]=(S.inv[k]||0)-cnt[k];if(S.inv[k]<=0)delete S.inv[k];});
    S.coins+=pay;S.earned+=pay;S.sold++;checkLevel();
    if(correct&&!c.walkin){S.rel[c.name]=(S.rel[c.name]||0)+1;if(Math.random()<.4){S.follow=S.follow||[];if(!S.follow.some(f=>f.rid===c.id))S.follow.push({rid:c.id,craft:c.answer,due:S.day+1+Math.floor(Math.random()*4)});}}}
  S.tmp.react={line,pay,correct};S.tmp.sel=[];S.tmp.locked=true;render();
  if(pay>0){const g=document.createElement('div');g.className='gain';g.textContent='+'+pay;$('#main').appendChild(g);}
  const wasMoth=correct&&/moth/i.test(c.name)&&!flag('moth_served');
  setTimeout(()=>{S.tmp.locked=false;
    if(wasMoth)playScene('moth_done',()=>nextCustomer());else nextCustomer();},pay>0||correct?1900:1500);
  save();
}
function sendAway(){if(!S.cur)return;nextCustomer();}

/* ---------- crafting & foraging ---------- */
function canMake(c){return parseIng(c.ingredients).every(p=>haveCount(p.name)>=p.qty);}
function craft(id){
  const c=D.crafts.find(x=>x.id===id);if(!c||!canMake(c))return;
  parseIng(c.ingredients).forEach(p=>takeItems(p.name,p.qty));
  const tier=(c.moon==='Any'||c.moon===moonOf(S.day))?'Proper':'Improper';
  addItem(c.name,1,tier);save();
  toast(`Made ${c.name} (${tier})`+(tier==='Improper'?' · wrong moon':''));

function counterY(sc,x){const pts=[].concat(...(sc.counter||[]).filter(s=>s.t==='wall'&&s.pts).map(s=>s.pts)).sort((a,b)=>a[0]-b[0]);if(!pts.length)return null;if(x<=pts[0][0])return pts[0][1];for(let i=1;i<pts.length;i++)if(x<=pts[i][0]){const a=pts[i-1],b=pts[i],t=(x-a[0])/Math.max(1,b[0]-a[0]);return a[1]+(b[1]-a[1])*t;}return pts[pts.length-1][1];}
function placeCust(){

  const [W,H]=dimsOf(sid),cw=m.clientWidth,ch=m.clientHeight,k=Math.max(cw/W,ch/H),sc2=parseFloat(el.dataset.sc)||1;el.style.width=(H*k*.4*sc2)+'px';el.style.height=(H*k*.6*sc2)+'px';el.querySelectorAll(':scope>img').forEach(i=>{i.style.cssText+=';width:100%;height:100%;object-fit:contain;object-position:bottom';});const w=el.offsetWidth,h=el.offsetHeight;if(!h)return;

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-g]');if(!t)return;
  const a=t.dataset.g;
  if(a==='scrim'){if(e.target===t)closeModal();return;}
  switch(a){
    case'begin':S=DEFAULT();S.started=true;save();render();playScene('arrival',()=>render());break;
    case'continue':load();S.started=true;render();break;
    case'close':if(S.phase==='night'&&!S.cur&&!$('#overlay').firstChild)closeNight();else closeModal();break;
    case'open':openStall();break;
    case'dusk':setPhase('dusk');break;
    case'forage':renderZones();break;
    case'pick':{const k=t.dataset.k;const inv=S.inv[k]||0;const used=sel().filter(x=>x===k).length;if(S.tmp.locked)break;if(used<inv)sel().push(k);else{const ix=sel().indexOf(k);if(ix>-1)sel().splice(ix,1);}render();break;}
    case'offer':if(!S.tmp.locked)offer();break;
    case'away':if(!S.tmp.locked)sendAway();break;
    case'bench':renderBench();break;
    case'bkind':benchKind=t.dataset.v;renderBench();break;
    case'craft':startCraft(t.dataset.id);break;
    case'pack':renderPack();break;
    case'almanac':renderAlmanac();break;
    case'atab':almTab=t.dataset.v;renderAlmanac();break;
    case'almopen':almOpenBook();break;case'almgo':almGo(t.dataset.p);break;case'almnext':almStep(1);break;case'almprev':almStep(-1);break;
    case'wren':visitWren();break;
    case'wrenbuy':{const g=D.gathers.find(x=>x.name===t.dataset.n),pr=g&&(WREN_PRICE[g.rarity]||3);if(g&&S.coins>=pr){S.coins-=pr;addItem(g.name,1,'Proper');save();render();renderWrenShop('Bought '+g.name+'.');}break;}
    case'wrentalk':wrenTalk();break;
    case'settings':renderSettings();break;
    case'mode':S.mode=t.dataset.v;save();renderSettings();break;
    case'newgame':if(confirm('Delete your save and start over?')){localStorage.removeItem(SAVE_KEY);S=DEFAULT();closeModal();render();}break;
    case'admin':renderAdmin();break;
    case'fs':toggleFS();break;
  }
});

/* ===== The Almanac: a book of shadows =====
   Pages are built from the Game Book data (recipes, gathering, stall, callers), so every new entry becomes a page by itself.
   Art: your open-book + cover images (replace them in the Game Book > UI > Almanac). Page turns are a 3D sheet that swings from the spine. */
const ALM={cover:true,spread:0,busy:false,pages:[],idx:{},tabs:[],q:'',sx:null};
const almArt=k=>itemUrl('ui_almanac_'+k)||ALMART[k];
/* where the paper sits on the open-book picture (percent of the picture) */
const ALM_BOX={L:{x:14.6,y:8,w:31.4,h:75},R:{x:54,y:8,w:32,h:75}};
const ALM_PAPER={L:{x:12.2,y:4.4,w:37.4,h:82.6},R:{x:50.4,y:4.4,w:37.6,h:82.6}};

function almSections(){
  const lc=(l,v)=>{try{return listColor(l,v);}catch(e){return '#8a5a3a';}};
  const meta=(arr)=>`<div class="am">${arr.filter(Boolean).join('')}</div>`;
  const rec=D.crafts.map(c=>({key:c.id,name:c.name,txt:(c.name+' '+c.kind+' '+c.purpose+' '+c.ingredients+' '+(c.lore||'')).toLowerCase(),
    html:`<article class="ae ${c.level>S.level?'lock':''}">${itemImg(c,'aeart')}<h4>${esc(c.name)}</h4>${meta([`<b style="--c:${lc('kinds',c.kind)}">${esc(c.kind)}</b>`,`<span>Level ${c.level}</span>`,`<span>${c.moon==='Any'||!c.moon?'Any moon':esc(c.moon)+' moon'}</span>`])}
      <p><b>Needs:</b> ${esc(c.ingredients)}</p>${c.purpose?`<p>${esc(c.purpose)}</p>`:''}${c.method?`<p class="meth">${esc(c.method)}</p>`:''}${c.lore?`<p class="lore">${esc(c.lore)}</p>`:''}${c.safety?`<div class="safe">${esc(c.safety)}</div>`:''}</article>`}));
  const gat=D.gathers.map(g=>({key:g.id,name:g.name,txt:(g.name+' '+g.latin+' '+g.lore+' '+g.zone+' '+(g.corr||'')).toLowerCase(),
    html:`<article class="ae">${itemImg(g,'aeart')}<h4>${esc(g.name)}</h4>${g.latin?`<div class="lat">${esc(g.latin)}</div>`:''}${meta([`<b style="--c:${lc('zones',g.zone)}">${esc(g.zone)}</b>`,`<span>${esc(g.rarity||'')}</span>`,g.when?`<span>${esc(g.when)}</span>`:''])}
      ${g.corr?`<p><b>${esc(g.corr)}</b></p>`:''}${g.lore?`<p>${esc(g.lore)}</p>`:''}${g.safety?`<div class="safe">${esc(g.safety)}</div>`:''}</article>`}));
  const upg=D.upgrades.map(u=>({key:u.id,name:u.name,txt:(u.name+' '+u.effect+' '+u.ingredients).toLowerCase(),
    html:`<article class="ae">${itemImg(u,'aeart')}<h4>${esc(u.name)}</h4>${u.stall?`<div class="lat">${esc(u.stall)}</div>`:''}${u.ingredients?`<p><b>Needs:</b> ${esc(u.ingredients)}</p>`:''}${u.effect?`<p>${esc(u.effect)}</p>`:''}</article>`}));
  const req=D.requests.map(r=>({key:r.id,name:r.name,txt:(r.name+' '+r.kind+' '+r.ask).toLowerCase(),
    html:`<article class="ae">${itemImg(r,'aeart')}<h4>${esc(r.name)}</h4>${meta([`<b style="--c:${lc('kinds',r.kind)}">${esc(r.kind||'')}</b>`,r.level?`<span>Level ${r.level}</span>`:''])}${r.ask?`<p class="lore">“${esc(r.ask)}”</p>`:''}</article>`}));
  return [{id:'rec',name:'Recipes',items:rec},{id:'gat',name:'Gathering',items:gat},{id:'upg',name:'Stall',items:upg},{id:'req',name:'Callers',items:req}];
}

/* split every section into pages by measuring real text in a hidden page box */
function almPaginate(){
  const book=document.querySelector('.alm-book');if(!book)return;
  let m=book.querySelector('.alm-measure');if(!m){m=document.createElement('div');m.className='alm-txt alm-measure R';book.appendChild(m);}

    tabs.push({id:sec.id,name:sec.name,page:pages.length});
    const hd=`<div class="ash"><span>${esc(sec.name)}</span><i>${sec.items.length} entries</i></div>`;
    let buf=[],first=true;

function almContents(){

function almResults(q){q=(q||'').trim().toLowerCase();if(!q)return '<p class="lore" style="margin-top:.6em">Search for a recipe, a plant, a caller or a word from the lore.</p>';

function almTonight(){
  const moon=moonOf(S.day),fav=D.crafts.filter(c=>c.moon===moon);
  const list=fav.length?fav.slice(0,10).map(c=>`<button class="toc sm" data-g="almgo" data-p="${ALM.idx[c.id]}"><span>${esc(c.name)}</span><u></u><em>${(ALM.idx[c.id]||0)+1}</em></button>`).join(''):'<p class="lore">Nothing in the book asks for this moon. Any recipe will do.</p>';

}
function almPageHtml(i){const p=ALM.pages[i];if(!p)return '<div class="orn" style="margin-top:30%">✦</div>';return p.t==='contents'?almContents():p.t==='tonight'?almTonight():p.html;}
const almSide=i=>i%2===0?'L':'R';
function almTxt(i){const s=almSide(i),b=ALM_BOX[s];return `<div class="alm-txt ${s}" style="left:${b.x}%;top:${b.y}%;width:${b.w}%;height:${b.h}%">${almPageHtml(i)}</div><div class="alm-num ${s}">${i<ALM.pages.length?i+1:''}</div>`;}
const _almN=(u,p)=>0.5+0.25*Math.sin(u*7+p)+0.15*Math.sin(u*17+p*2.3)+0.1*Math.sin(u*31+p*4.1);
function almClip(side){const pts=[],n=26,L=side==='L';
  const jx=y=>.5+1.6*_almN(y,L?1.7:4.2),jy=x=>.25+.9*_almN(x,L?2.9:0.6);
  /* top edge from the spine outwards, then down the outer edge, then back along the bottom */
  for(let k=0;k<=n;k++){const u=k/n,x=L?100-u*100:u*100;pts.push([x,jy(u)+(k>n-3?(k-(n-3))*.5:0)]);}
  for(let k=1;k<n;k++){const y=k/n*100,x=L?jx(k/n):100-jx(k/n);pts.push([x,y]);}
  for(let k=n;k>=0;k--){const u=k/n,x=L?100-u*100:u*100;pts.push([x,100-jy(u+3)-(k>n-3?(k-(n-3))*.5:0)]);}
  return 'polygon('+pts.map(p=>p[0].toFixed(2)+'% '+p[1].toFixed(2)+'%').join(',')+')';}
function almPaper(s){const p=ALM_PAPER[s],pg=itemUrl('ui_almanac_page');
  const bg=pg?`background-image:url(&quot;${pg}&quot;);background-size:100% 100%;background-position:0 0;${s==='L'?'transform:scaleX(-1);':''}`:`background-size:${10000/p.w}% ${10000/p.h}%;background-position:${p.x/(100-p.w)*100}% ${p.y/(100-p.h)*100}%;clip-path:${almClip(s)};`;
  return `<div class="alm-paper" style="left:${p.x}%;top:${p.y}%;width:${p.w}%;height:${p.h}%;${bg}"></div>`;}
/* one slice of a page: a book-sized layer shifted so only this slice shows */
function almFace(i,leftPx,bookW){return `<div class="alm-w" style="left:${leftPx}px;width:${bookW}px">${almPaper(almSide(i))}${almTxt(i)}</div>`;}

function almMount(){

function almStatic(spread,lp,rp){const book=document.querySelector('.alm-book');if(!book)return;book.querySelector('.alm-pgL').innerHTML=almTxt(lp==null?spread*2:lp);book.querySelector('.alm-pgR').innerHTML=almTxt(rp==null?spread*2+1:rp);}
function almRibbons(){const r=document.querySelector('.alm-rib');if(!r)return;const here=ALM.spread*2+1;let act=ALM.tabs[0];ALM.tabs.forEach(t=>{if(t.page<=here)act=t;});

/* turn to a spread. The sheet is cut into thin slices that hinge off each other, so the paper bends as it swings. */
function almGo(page){
  if(ALM.cover){almOpenBook();}
  const tgt=Math.max(0,Math.min(almSpreads()-1,Math.floor((+page||0)/2)));almTurnTo(tgt);}
function almStep(d){if(ALM.cover){almOpenBook();return;}almTurnTo(ALM.spread+d);}
function almTurnTo(tgt){
  const book=document.querySelector('.alm-book');if(!book||ALM.busy)return;tgt=Math.max(0,Math.min(almSpreads()-1,tgt));const cur=ALM.spread;if(tgt===cur)return;
  const fwd=tgt>cur,d3=book.querySelector('.alm-3d');ALM.busy=true;
  const front=fwd?cur*2+1:cur*2,back=fwd?tgt*2:tgt*2+1;
  if(fwd)almStatic(cur,cur*2,tgt*2+1);else almStatic(cur,tgt*2,cur*2+1);
  const bw=book.clientWidth,Sw=bw/2,N=16,sw=Sw/N;
  let inner='';
  for(let i=N-1;i>=0;i--){
    const A=-(Sw+i*sw),B=-(Sw-(i+1)*sw),fl=fwd?A:B,bl=fwd?B:A;
    const pos=i===0?(fwd?'left:0':'left:'+(Sw-sw)+'px'):(fwd?'left:'+sw+'px':'left:'+(-sw)+'px');
    inner=`<div class="strip" style="width:${sw+1.5}px;${pos};transform-origin:${fwd?'0':'100%'} 50%"><div class="face f">${almFace(front,fl,bw)}<i class="shade"></i></div><div class="face b">${almFace(back,bl,bw)}<i class="shade"></i></div>${inner}</div>`;
  }
  const sh=document.createElement('div');sh.className='alm-sheet '+(fwd?'fwd':'back');sh.innerHTML=inner;
  const cast=document.createElement('div');cast.className='alm-cast '+(fwd?'r':'l');
  d3.appendChild(cast);d3.appendChild(sh);
  const strips=[...sh.querySelectorAll('.strip')],shades=strips.map(s=>[...s.querySelectorAll(':scope > .face > .shade')]);
  const dir=fwd?-1:1,dur=1250,CURL=4.2;let t0=null,done=false;
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const fin=()=>{if(done)return;done=true;ALM.spread=tgt;almStatic(tgt);sh.remove();cast.remove();ALM.busy=false;almRibbons();};
  const frame=ts=>{if(done)return;if(t0==null)t0=ts;const t=Math.min(1,(ts-t0)/dur),e=ease(t),th=180*e,bend=Math.sin(2*Math.PI*e);
    let cum=0;
    strips.forEach((s,i)=>{const f=.55+.9*i/(N-1),c=i?CURL*bend*f:0,ang=i?c:th;s.style.transform=`rotateY(${dir*ang}deg)`;cum+=ang;
      const phi=cum*Math.PI/180,facing=Math.abs(Math.cos(phi)),lit=.5*(1-facing)+Math.max(-.08,Math.min(.14,(i?c:0)*.02));
      shades[i].forEach(x=>{x.style.opacity=Math.max(0,Math.min(.75,lit)).toFixed(3);});});
    cast.style.opacity=(.38*Math.sin(Math.PI*e)).toFixed(3);
    if(t<1)requestAnimationFrame(frame);else fin();};
  requestAnimationFrame(frame);setTimeout(fin,dur+400);
}
document.addEventListener('keydown',e=>{if(!document.querySelector('.alm-book'))return;if(/INPUT|TEXTAREA/.test((e.target||{}).tagName))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){almStep(1);e.preventDefault();}else if(e.key==='ArrowLeft'||e.key==='PageUp'){almStep(-1);e.preventDefault();}else if(e.key==='Escape'){closeModal();}});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='almq'){ALM.q=e.target.value;const r=document.getElementById('almres');if(r)r.innerHTML=almResults(ALM.q);}});
/* swipe */

document.addEventListener('pointerup',e=>{if(ALM.sx==null)return;const dx=e.clientX-ALM.sx;ALM.sx=null;if(Math.abs(dx)>70&&document.querySelector('.alm-book'))almStep(dx<0?1:-1);});
let _almR;window.addEventListener('resize',()=>{clearTimeout(_almR);_almR=setTimeout(()=>{if(document.querySelector('.alm-book')&&!ALM.busy){const k=ALM.spread*2;almPaginate();ALM.spread=Math.min(Math.floor(k/2),almSpreads()-1);almStatic(ALM.spread);almRibbons();}},180);});

/* ===== hands-on actions: timing minigame, foraging scene, crafting steps ===== */
const STEPS={

const ZONEV={'Marsh':'The marsh edge','Garden and hedgerow':'Garden and hedgerow','Woods':'The wood','Canal and shore':'Canal and shore','Town':'Town lanes'};
let MG=null;

function miniStep(){
  const m=MG;if(m.i>=m.steps.length){const avg=m.sc.reduce((a,b)=>a+b,0)/m.sc.length;const d=m.done;MG=null;mgLayer().innerHTML='';cancelAnimationFrame(window._mgraf);d(avg);return;}
  m.center=.28+Math.random()*.44;m.w=Math.max(.1,.2-.012*(S.level-1));m.pos=0;m.dir=1;m.speed=.55+Math.random()*.35+.06*m.i;m.run=true;m.last=performance.now();
  mgLayer().innerHTML=`<div class="scrim"><div class="modal narrow" style="text-align:center"><div class="eyebrow">${esc(m.title)}</div><h2>${esc(m.steps[m.i])}</h2>
   <div class="note" style="margin:6px 0 14px">${m.hint?esc(m.hint)+'<br>':''}Click, tap or press Space when the marker is in the gold.</div>
   <div id="mgbar" style="position:relative;height:34px;border-radius:99px;background:rgba(14,9,22,.8);border:1px solid var(--line);overflow:hidden">
    <div style="position:absolute;top:0;bottom:0;left:${(m.center-m.w/2)*100}%;width:${m.w*100}%;background:linear-gradient(#f0c674,#b5862f);opacity:.85"></div>
    <div style="position:absolute;top:0;bottom:0;left:${(m.center-m.w/8)*100}%;width:${m.w/4*100}%;background:#fff4c8;opacity:.9"></div>
    <div id="mgmark" style="position:absolute;top:-2px;bottom:-2px;width:6px;background:#fff;border-radius:3px;box-shadow:0 0 10px #fff"></div></div>
   <div class="lbl" style="margin:12px 0">Step ${m.i+1} of ${m.steps.length}</div><button class="btn gold" id="mgbtn">Now</button> <button class="btn sm" id="mgcancel">Cancel</button></div></div>`;
  const tick=t=>{if(!MG||!MG.run)return;const dt=(t-m.last)/1000;m.last=t;m.pos+=m.dir*m.speed*dt;if(m.pos>=1){m.pos=1;m.dir=-1;}if(m.pos<=0){m.pos=0;m.dir=1;}

  const d=Math.abs(m.pos-m.center);const sc=d<=m.w/8?1:d<=m.w/2?.75-(d-m.w/8)/(m.w/2-m.w/8)*.3:Math.max(0,.4-(d-m.w/2)*2);

/* ----- crafting by hand ----- */
function startCraft(id){
  const c=D.crafts.find(x=>x.id===id);if(!c||!canMake(c))return;
  const steps=(STEPS[c.kind]||STEPS.Craft).slice();
  if(c.level>=3)steps.push('Final touch');
  craftPlay(c,avg=>{
    parseIng(c.ingredients).forEach(p=>takeItems(p.name,p.qty));
    let tier=TIERS_BY(avg);
    const wrong=!(c.moon==='Any'||c.moon===moonOf(S.day));
    if(wrong){const r=['Improper','Proper','Fine','Perfect'];tier=r[Math.max(0,r.indexOf(tier)-1)];}
    addItem(c.name,1,tier);save();closeModal();
    toast(`Made ${c.name} · ${tier}`+(wrong?' (wrong moon cost a tier)':''));
    if(c.name==='Reed Wick Candle'&&!flag('crafted_candle'))playScene('first_candle',()=>render());else{render();renderBench();}
  });
}

/* ----- foraging by hand ----- */
let FZ=null;
function renderZones(){
  const zs=Object.keys(ZONEV);
  openModal(`${X}<div class="eyebrow">${S.phase==='day'?'Daylight':'Dusk'}</div><h2>Where will you go?</h2><div class="note" style="margin:8px 0">Each place grows different things. Click what glows.</div>
  <div class="grid">${zs.map(z=>{const n=D.gathers.filter(g=>g.zone===z&&g.source==='Gather').length;return `<div class="rcard" style="--c:${listColor('zones',z)}"><h4>${esc(ZONEV[z])}</h4><p>${n} things to find</p><div class="actions"><button class="btn gold sm" data-g="zone" data-z="${esc(z)}">Go</button></div></div>`;}).join('')}</div>`);
}
function enterZone(z){
  const pool=D.gathers.filter(g=>g.zone===z&&g.source==='Gather');
  const want=[];
  if(!flag('gathered')){if(z==='Marsh'){want.push('Reed','Reed','Reed');}if(z==='Garden and hedgerow')want.push('Rosemary','Rosemary');}
  while(want.length<7)want.push(rnd(pool).name);
  const nodes=want.slice(0,7).map((n,i)=>({n,x:8+Math.random()*80,y:38+Math.random()*48,done:false,i}));
  FZ={z,nodes,got:[]};drawZone();
}
function drawZone(){
  const f=FZ,col=listColor('zones',f.z);
  const bg=f.z==='Marsh'?stallBack('dusk','Waxing'):marshBack?marshBack():stallBack('dusk','Waxing');
  const left=f.nodes.filter(n=>!n.done).length;
  $('#overlay').innerHTML=`<div class="scrim"><div class="modal" style="padding:0;overflow:hidden;max-width:1000px"><div style="position:relative;height:min(70vh,520px);background:linear-gradient(#2a1a3c,#1a2a28 70%,#0d1a14)">
   <div style="position:absolute;inset:0;opacity:.55">${bg}</div>
   <div style="position:absolute;left:14px;top:12px;z-index:3"><span class="eyebrow">${esc(ZONEV[f.z])}</span><div class="lbl">${f.got.length?'Found: '+esc(f.got.join(', ')):'Click the glowing things'}</div></div>
   <button class="ibtn x" data-g="zleave" style="z-index:3">✕</button>
   ${f.nodes.map(n=>n.done?'':`<button data-g="node" data-i="${n.i}" title="Something glows here" style="position:absolute;left:${n.x}%;top:${n.y}%;width:44px;height:44px;margin:-22px;border-radius:50%;border:0;cursor:pointer;z-index:3;background:radial-gradient(circle,#fff4c8 0%,${col} 40%,transparent 72%);box-shadow:0 0 22px ${col};animation:pulse 1.8s ease-in-out infinite"></button>`).join('')}
   <div style="position:absolute;left:0;right:0;bottom:14px;text-align:center;z-index:3"><button class="btn sm" data-g="${left?'zleave':'zdone'}">${left?'Leave':'Head back'}</button> <button class="btn sm gold" data-g="zagain">Walk further (new spot)</button></div>
  </div></div></div>`;
}
function pickNode(i){
  const n=FZ.nodes[i];if(!n||n.done)return;const g=D.gathers.find(x=>x.name===n.n);
  const steps=[ (g&&/root|dig/i.test(g.name+g.when))?'Loosen the earth':'Pick gently' ];
  miniRun(g?g.name:n.n,steps,g?(g.corr||''):'',avg=>{
    const t=TIERS_BY(avg);n.done=true;addItem(n.n,1,t);FZ.got.push(n.n+(t!=='Proper'?' ('+t+')':''));
    if(!flag('gathered')&&haveCount('Reed')>=2&&haveCount('Rosemary')>=1){S.flags.gathered=true;toast('You have what Wren asked for');}
    save();drawZone();
  });
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-g]');if(!t)return;const a=t.dataset.g;
  if(a==='zone'){enterZone(t.dataset.z);}
  else if(a==='node'){pickNode(+t.dataset.i);}

},true);

(function(){

const SERIF='600 22px "Cormorant Garamond",Georgia,serif';
function radial(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function flame(c,x,y,s,t){const f=1+Math.sin(t*9+x)*.08+Math.sin(t*14)*.05;radial(c,x,y-8*s,60*s,'#ffb347',.55);
  const g=c.createLinearGradient(x,y-34*s*f,x,y+6*s);g.addColorStop(0,'#fff6d0');g.addColorStop(.45,'#ffc65a');g.addColorStop(1,'#e8742c');c.fillStyle=g;c.beginPath();c.moveTo(x,y-34*s*f);c.bezierCurveTo(x+14*s,y-14*s,x+11*s,y+4*s,x,y+6*s);c.bezierCurveTo(x-11*s,y+4*s,x-14*s,y-14*s,x,y-34*s*f);c.fill();}
function stars(c,x,y,r,t,col){for(let i=0;i<4;i++){const a=t*1.5+i*1.57,d=r*(.6+.4*Math.sin(t*3+i));c.fillStyle=rgba(col||'#fff4c8',.6);c.beginPath();c.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,2,0,TAU);c.fill();}}
function bench(c,g){
  const bg=c.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#241538');bg.addColorStop(.6,'#150d22');bg.addColorStop(1,'#0b0712');c.fillStyle=bg;c.fillRect(0,0,W,H);
  radial(c,720,70,420,'#ffb347',.22);radial(c,120,420,300,'#8a5aae',.14);
  const wd=c.createLinearGradient(0,400,0,H);wd.addColorStop(0,'#4a3020');wd.addColorStop(1,'#26170e');c.fillStyle=wd;c.fillRect(0,400,W,H-400);
  c.strokeStyle='rgba(0,0,0,.28)';c.lineWidth=2;for(let i=0;i<5;i++){c.beginPath();c.moveTo(0,420+i*26);c.lineTo(W,420+i*26);c.stroke();}
  c.strokeStyle='rgba(255,210,150,.12)';c.beginPath();c.moveTo(0,400);c.lineTo(W,400);c.stroke();
  g.motes.forEach(m=>{m.y-=m.s*.3;m.x+=Math.sin(g.t+m.p)*.2;if(m.y<-5){m.y=H+5;m.x=Math.random()*W;}c.fillStyle=rgba('#ffd98a',.25+.2*Math.sin(g.t*2+m.p));c.beginPath();c.arc(m.x,m.y,m.r,0,TAU);c.fill();});
}
function vignette(c){const v=c.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.7);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(4,2,8,.55)');c.fillStyle=v;c.fillRect(0,0,W,H);}
function jar(c,x,y,w,h,fill,lv,col){ // glass jar, bottom-centre at (x,y)
  c.save();rrect(c,x-w/2,y-h,w,h,16);c.clip();c.fillStyle='rgba(180,200,220,.07)';c.fillRect(x-w/2,y-h,w,h);
  if(lv>0){const fy=y-h*lv,g=c.createLinearGradient(0,fy,0,y);g.addColorStop(0,rgba(fill,.95));g.addColorStop(1,rgba(col||fill,.9));c.fillStyle=g;c.fillRect(x-w/2,fy,w,h*lv);c.fillStyle=rgba('#fff',.22);c.fillRect(x-w/2,fy,w,3);}
  c.restore();c.strokeStyle='rgba(220,235,255,.45)';c.lineWidth=2.4;rrect(c,x-w/2,y-h,w,h,16);c.stroke();c.fillStyle='rgba(255,255,255,.18)';rrect(c,x-w/2+8,y-h+10,7,h-30,4);c.fill();}
const lbl=(c,txt,x,y,col,sz)=>{c.fillStyle=col||'rgba(242,233,219,.8)';c.font=(sz||'600 15px')+' "Nunito Sans",sans-serif';c.textAlign='center';c.fillText(txt,x,y);};
function meter(c,x,y,w,v,col,t){c.fillStyle='rgba(10,6,16,.7)';rrect(c,x,y,w,12,6);c.fill();c.strokeStyle='rgba(240,198,116,.3)';c.lineWidth=1;c.stroke();if(v>0){c.fillStyle=col||GOLD;rrect(c,x+1,y+1,Math.max(10,(w-2)*clamp(v,0,1)),10,5);c.fill();}if(t)lbl(c,t,x+w/2,y-6,null,'700 12px');}
function hash(n){let h=7;for(const ch of n)h=(h*37+ch.charCodeAt(0))%997;return h;}

/* ---------------- the stages ---------------- */
const ST={};

ST.wick={t:'Set the wick straight',h:'Keep the tongs on the glowing tip while the wick sways.',dur:7.5,
 init(g){g.in=0;g.px=W/2;g.py=250;},
 draw(g,c,dt){const t=g.t,tx=W/2+(70+25*g.d)*Math.sin(t*.9)+32*Math.sin(t*2.1+1),ty=210+18*Math.sin(t*1.3);g.tx=tx;g.ty=ty;
  jar(c,W/2,400,170,170,'#f3e3b5',.62,'#d9bf84');c.strokeStyle='#2a1c14';c.lineWidth=5;c.lineCap='round';c.beginPath();c.moveTo(W/2,262);c.quadraticCurveTo(W/2+(tx-W/2)*.2,(262+ty)/2,tx,ty);c.stroke();
  const ok=Math.hypot(g.px-tx,g.py-ty)<46;if(!g.ended){g.in+=ok?dt:0;}radial(c,tx,ty,60,ok?'#9ad6a8':'#ffd98a',.5);
  c.strokeStyle=ok?'#9ad6a8':GOLD;c.lineWidth=3;c.beginPath();c.arc(g.px,g.py,26,0,TAU);c.stroke();c.beginPath();c.moveTo(g.px-26,g.py);c.lineTo(g.px+26,g.py);c.moveTo(g.px,g.py-26);c.lineTo(g.px,g.py+26);c.stroke();
  meter(c,330,470,200,g.t/this.dur,'#8a5aae');if(g.t>=this.dur&&!g.ended)g.end(g.in/this.dur);}};

ST.pour={t:'Pour slow',h:'Hold to pour. Further right pours faster, and fast pours make bubbles. Let go at the line.',
 init(g){g.fill=0;g.bub=0;g.tgt=rr(.62,.8);g.temp=1;g.pour=false;g.px=W/2;g.fast=0;},
 draw(g,c,dt){const P=g.p||{},warm=P.warm,col=P.col||'#f3e3b5',tgt=g.tgt;
  if(warm&&!g.ended)g.temp=Math.max(.15,g.temp-dt*.09*(1+g.d));
  const rate=g.down&&!g.ended?(.12+.5*clamp(g.px/W,0,1))*(warm?g.temp:1):0;g.fast=rate>.4?g.fast+dt:g.fast;g.fill+=rate*dt;if(!g.ended&&g.fill>1.04)g.end(.1);
  jar(c,W/2,420,200,200,col,g.fill,P.col2);c.strokeStyle='rgba(255,236,160,.9)';c.setLineDash([8,6]);c.lineWidth=2;c.beginPath();c.moveTo(W/2-120,420-200*tgt);c.lineTo(W/2+120,420-200*tgt);c.stroke();c.setLineDash([]);lbl(c,'fill to here',W/2+160,420-200*tgt+5,GOLD,'700 13px');
  const px=clamp(g.px,160,W-160),tilt=g.down?-.7:-.15;c.save();c.translate(px,120);c.rotate(tilt*(1)+(g.down?0:0));
  const pg=c.createLinearGradient(-50,0,50,0);pg.addColorStop(0,'#8c6a4a');pg.addColorStop(1,'#5b3f2b');c.fillStyle=pg;rrect(c,-50,-40,100,80,14);c.fill();c.fillStyle=P.vcol||col;c.fillRect(-44,-30,88,10);c.restore();
  if(rate>0){c.strokeStyle=rgba(col,.95);c.lineWidth=7-rate*5;c.beginPath();c.moveTo(px+10,150);c.lineTo(W/2+Math.sin(g.t*30)*2,420-200*g.fill);c.stroke();for(let i=0;i<3;i++){c.fillStyle=rgba('#fff',.4);c.beginPath();c.arc(W/2+rr(-40,40),420-200*g.fill-rr(0,rate*60),rr(1,3+rate*5),0,TAU);c.fill();}}
  meter(c,W/2-130,462,260,g.fill/1.04,P.col||GOLD);if(warm)meter(c,W-200,60,140,g.temp,'#e8742c','warmth');
  if(!g.ended&&((!g.down&&g.fill>.03&&g.lift)||(warm&&g.temp<=.16&&g.fill>.03))){g.end(clamp(1-Math.abs(g.fill-tgt)/.22,0,1)*(1-clamp(g.fast*.12,0,.3)));}},
 up(g){if(g.fill>.03)g.lift=true;},down(g,x){g.lift=false;}};

ST.petals={t:'Press the petals',h:'Drag each petal onto a glowing spot in the soft wax.',
 init(g){const n=6;g.spots=[];for(let i=0;i<n;i++){const a=i/n*TAU-1.57;g.spots.push({x:W/2+Math.cos(a)*(i%2?90:120),y:250+Math.sin(a)*(i%2?50:66),done:false,acc:0});}
  g.pet=g.spots.map((s,i)=>({x:200+i*92,y:470,hx:200+i*92,hy:470,s,drag:false,placed:false,rot:rr(0,6)}));g.drag=null;},
 draw(g,c,dt){const col=(g.p&&g.p.col)||'#b59cd6',wax=(g.p&&g.p.wax)||'#f3e3b5';
  c.fillStyle=rgba(wax,.95);c.beginPath();c.ellipse(W/2,250,190,105,0,0,TAU);c.fill();c.strokeStyle='rgba(120,80,40,.5)';c.lineWidth=6;c.stroke();const sh=c.createRadialGradient(W/2-40,220,10,W/2,250,200);sh.addColorStop(0,'rgba(255,255,255,.35)');sh.addColorStop(1,'rgba(0,0,0,.18)');c.fillStyle=sh;c.beginPath();c.ellipse(W/2,250,190,105,0,0,TAU);c.fill();
  g.spots.forEach(s=>{if(!s.done){const p=.5+.5*Math.sin(g.t*3+s.x);radial(c,s.x,s.y,38,'#ffd98a',.35+.25*p);c.strokeStyle=rgba('#ffd98a',.7);c.setLineDash([5,5]);c.lineWidth=2;c.beginPath();c.arc(s.x,s.y,22,0,TAU);c.stroke();c.setLineDash([]);}});
  g.pet.forEach(p=>{c.save();c.translate(p.x,p.y);c.rotate(p.rot);const q=c.createRadialGradient(0,0,2,0,0,26);q.addColorStop(0,rgba('#fff',.8));q.addColorStop(.4,rgba(col,1));q.addColorStop(1,rgba(col,.7));c.fillStyle=q;c.beginPath();c.ellipse(0,0,10,24,0,0,TAU);c.fill();c.restore();if(g.drag===p)radial(c,p.x,p.y,40,col,.4);});
  if(!g.ended&&g.pet.every(p=>p.placed))g.end(g.spots.reduce((a,s)=>a+s.acc,0)/g.spots.length);},
 down(g,x,y){g.drag=g.pet.filter(p=>!p.placed).sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y))[0];if(g.drag&&Math.hypot(g.drag.x-x,g.drag.y-y)>50)g.drag=null;},
 move(g,x,y){if(g.drag){g.drag.x=x;g.drag.y=y;}},
 up(g){const p=g.drag;g.drag=null;if(!p)return;const free=g.spots.filter(s=>!s.done).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];
  if(free&&Math.hypot(free.x-p.x,free.y-p.y)<60){p.x=p.x*.4+free.x*.6;p.y=p.y*.4+free.y*.6;p.placed=true;free.done=true;free.acc=clamp(1-Math.hypot(free.x-p.x,free.y-p.y)/55,.35,1);}else{p.x=p.hx;p.y=p.hy;}}};

ST.dip={t:'Dip and shape',h:'Dip when the ring closes on the gold ring. Three dips build the candle.',
 init(g){g.n=0;g.sc=[];g.ring=0;g.wait=0;g.res=null;},
 draw(g,c,dt){const col=(g.p&&g.p.col)||'#f3e3b5';jar(c,W/2,430,190,120,col,.78,'#d9bf84');
  const th=20+g.n*9;c.fillStyle=rgba(col,1);rrect(c,W/2-th/2,110,th,250,th/2);c.fill();c.fillStyle='rgba(255,255,255,.25)';rrect(c,W/2-th/2+3,115,4,240,2);c.fill();c.strokeStyle='#2a1c14';c.lineWidth=3;c.beginPath();c.moveTo(W/2,110);c.lineTo(W/2,90);c.stroke();
  if(g.res==null&&!g.ended){g.ring+=dt/(1.15-.18*g.d);}const R=100*(1.6-g.ring*.6);const cy=250;
  c.strokeStyle=rgba('#ffd98a',.9);c.lineWidth=3;c.beginPath();c.arc(W/2+150,cy,40,0,TAU);c.stroke();
  if(g.res==null){c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.arc(W/2+150,cy,Math.max(10,40*(2.8-g.ring*1.8)),0,TAU);c.stroke();if(g.ring>2.0)this.up(g,0,0,true);}
  else{lbl(c,g.res,W/2+150,cy+70,GOLD,'700 18px');g.wait-=dt;if(g.wait<=0){g.res=null;g.ring=0;if(g.n>=3&&!g.ended)g.end(g.sc.reduce((a,b)=>a+b,0)/3);}}
  for(let i=0;i<3;i++){c.fillStyle=i<g.n?GOLD:'rgba(255,255,255,.2)';c.beginPath();c.arc(W/2-30+i*30,490,6,0,TAU);c.fill();}},
 down(g,x,y,auto){if(g.res!=null||g.ended)return;const r=40*(2.8-g.ring*1.8),e=Math.abs(r-40)/40,sc=clamp(1-e*1.3,0,1);g.sc.push(auto?0:sc);g.n++;g.res=auto?'Too slow':sc>.85?'Perfect':sc>.55?'Good':'Uneven';g.wait=.55;},
 up(g,x,y,auto){if(auto)this.down(g,0,0,true);}};

ST.kettle={t:'Watch the kettle',h:'Lift it off the heat when the water is just about to roll. Never let it boil.',
 init(g){g.boil=rr(7,9.5)-g.d;g.res=null;g.ptc=[];},
 draw(g,c,dt){const p=g.t/g.boil,lift=g.res!=null;const ky=lift?Math.max(150,300-(g.t-g.lt)*260):300;
  flame(c,W/2-40,400,1.2,g.t);flame(c,W/2,404,1.5,g.t+1);flame(c,W/2+40,400,1.2,g.t+2);
  c.fillStyle='#2b2230';rrect(c,W/2-150,404,300,12,6);c.fill();
  const kg=c.createLinearGradient(W/2-110,0,W/2+110,0);kg.addColorStop(0,'#3a2e44');kg.addColorStop(.5,'#6b5a78');kg.addColorStop(1,'#2b2230');c.fillStyle=kg;rrect(c,W/2-100,ky-90,200,110,34);c.fill();rrect(c,W/2-35,ky-110,70,30,8);c.fill();
  c.strokeStyle='#6b5a78';c.lineWidth=8;c.beginPath();c.arc(W/2,ky-80,90,Math.PI*1.12,Math.PI*1.88);c.stroke();c.lineWidth=14;c.beginPath();c.moveTo(W/2+98,ky-60);c.lineTo(W/2+150,ky-95);c.stroke();
  if(!lift){for(let i=0;i<4+p*16;i++)if(Math.random()<.15+p*.4)g.ptc.push({x:W/2+rr(-70,70),y:ky-30,v:rr(30,70)+p*80,life:1,r:rr(2,5+p*6)});}
  g.ptc=g.ptc.filter(q=>(q.life-=dt*(.9))>0);g.ptc.forEach(q=>{q.y-=q.v*dt;q.x+=Math.sin(q.y*.05)*.6;c.fillStyle=rgba('#e8f0f5',.16*q.life);c.beginPath();c.arc(q.x,q.y,q.r+(1-q.life)*10,0,TAU);c.fill();});
  c.strokeStyle='rgba(240,198,116,.35)';c.lineWidth=10;c.beginPath();c.arc(W/2,470,60,Math.PI,TAU);c.stroke();c.strokeStyle='rgba(255,217,138,.8)';c.beginPath();c.arc(W/2,470,60,Math.PI+Math.PI*.78,Math.PI+Math.PI*.94);c.stroke();
  const a=Math.PI+Math.PI*clamp(p,0,1);c.strokeStyle='#fff';c.lineWidth=4;c.beginPath();c.moveTo(W/2,470);c.lineTo(W/2+Math.cos(a)*56,470+Math.sin(a)*56);c.stroke();lbl(c,'gentle',W/2-48,495,null,'700 11px');lbl(c,'rolling',W/2+52,495,null,'700 11px');
  if(!lift&&!g.ended&&p>=1){g.res='boiled';g.lt=g.t;g.end(.05);}},
 down(g){if(g.res!=null||g.ended)return;const p=g.t/g.boil;g.res='ok';g.lt=g.t;const e=p<.78?(.78-p)*3.2:p>.94?(p-.94)*8:0;g.end(clamp(1-e,0,1));}};

const FLAV={honey:[.95,.05,.3],sage:[.1,.55,.5],mint:[.3,.2,.8],chamomile:[.45,.1,.9],lavender:[.25,.15,.95],valerian:[.1,.8,.7],mugwort:[.1,.85,.5],yarrow:[.15,.7,.4],elderflower:[.55,.1,.6],hawthorn:[.5,.4,.5],rosehip:[.6,.25,.45],'willow bark':[.05,.9,.3],meadowsweet:[.55,.3,.5],marshmallow:[.4,.05,.85],'bog moss':[.1,.5,.6],thyme:[.1,.5,.45]};
const fv=n=>{const k=n.toLowerCase();for(const f in FLAV)if(k.includes(f))return FLAV[f];const h=hash(n);return [(h%10)/10,((h>>2)%10)/10,.3+((h>>4)%7)/10];};
ST.taste={t:'Taste and tweak',h:'Click a jar to add a pinch. Match the three gold marks, then serve.',
 init(g){g.its=(g.p&&g.p.items)||['Honey','Sage'];g.cnt=g.its.map(()=>0);const w=g.its.map(()=>1+Math.floor(Math.random()*3));const s=w.reduce((a,b)=>a+b,0);g.tg=[0,1,2].map(k=>g.its.reduce((a,n,i)=>a+fv(n)[k]*w[i]/s,0));g.sp=0;},
 draw(g,c,dt){const tot=g.cnt.reduce((a,b)=>a+b,0)||1,cur=[0,1,2].map(k=>tot?g.cnt.reduce((a,n,i)=>a+fv(g.its[i])[k]*g.cnt[i]/tot,0):0);g.cur=cur;
  const lc=g.cnt.some(x=>x)?`hsl(${40+cur[0]*20-cur[1]*30},${40+cur[2]*30}%,${30+cur[0]*18}%)`:'#2a2030';
  c.save();c.translate(W/2,260);c.fillStyle='#e8dfd0';c.beginPath();c.moveTo(-90,-50);c.lineTo(90,-50);c.quadraticCurveTo(86,70,0,86);c.quadraticCurveTo(-86,70,-90,-50);c.fill();c.fillStyle=lc;c.beginPath();c.ellipse(0,-42,82,16,0,0,TAU);c.fill();c.fillStyle=rgba('#fff',.18);c.beginPath();c.ellipse(-20,-46,34,5,0,0,TAU);c.fill();c.restore();
  const nm=['Sweet','Bitter','Calming'],cl=['#f0c674','#8a5aae','#7fc8a0'];
  for(let k=0;k<3;k++){const x=70,y=120+k*50;meter(c,x,y,200,cur[k],cl[k],null);lbl(c,nm[k],x+30,y-6,null,'700 12px');c.fillStyle='#fff4c8';c.fillRect(x+1+198*g.tg[k]-2,y-4,4,20);}
  g.its.forEach((n,i)=>{const x=W/2-((g.its.length-1)*80)+i*160,y=440;jar(c,x,y,70,62,'#7a5a3a',.7,'#5a4028');lbl(c,n,x,y+18,null,'700 13px');if(g.cnt[i]){c.fillStyle=GOLD;c.font='700 14px sans-serif';c.fillText('×'+g.cnt[i],x+40,y-40);}});
  c.fillStyle=GOLD;rrect(c,W-170,420,120,40,20);c.fill();c.fillStyle='#2a1c0f';c.font='800 15px "Nunito Sans"';c.textAlign='center';c.fillText('Serve',W-110,446);},
 down(g,x,y){if(Math.hypot(x-(W-110),y-440)<62&&g.cnt.some(v=>v)){const d=[0,1,2].reduce((a,k)=>a+Math.abs(g.cur[k]-g.tg[k]),0)/3;g.end(clamp(1-d*3.2,0,1));return;}
  g.its.forEach((n,i)=>{const bx=W/2-((g.its.length-1)*80)+i*160;if(Math.abs(x-bx)<40&&Math.abs(y-420)<50&&g.cnt.reduce((a,b)=>a+b,0)<12){g.cnt[i]++;}});}};

ST.stir={t:'Stir slow and steady',h:'Draw gentle circles around the cup. Too fast spills, too slow lets it settle.',dur:7.5,
 init(g){g.ang=null;g.w=0;g.in=0;g.spill=0;g.px=W/2;g.py=260;g.sw=0;},
 draw(g,c,dt){const cx=W/2,cy=270;const a=Math.atan2(g.py-cy,g.px-cx);if(g.ang!=null&&Math.hypot(g.px-cx,g.py-cy)>25){let d=a-g.ang;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;g.w=lerp(g.w,Math.abs(d)/Math.max(dt,.001),.12);}else g.w=lerp(g.w,0,.1);g.ang=a;
  const lo=1.1,hi=2.6,ok=g.w>=lo&&g.w<=hi;if(!g.ended){if(ok)g.in+=dt;if(g.w>hi)g.spill+=dt;}g.sw+=g.w*dt;
  c.fillStyle='#e8dfd0';c.beginPath();c.ellipse(cx,cy,150,70,0,0,TAU);c.fill();c.fillStyle='#d4c9b8';c.beginPath();c.ellipse(cx,cy+2,138,60,0,0,TAU);c.fill();
  const lq=(g.p&&g.p.col)||'#a9742e';const lg=c.createRadialGradient(cx,cy,5,cx,cy,130);lg.addColorStop(0,rgba(lq,.95));lg.addColorStop(1,rgba('#5a3a14',.98));c.fillStyle=lg;c.beginPath();c.ellipse(cx,cy,128,52,0,0,TAU);c.fill();

const items=c=>parseIng(c.ingredients).map(p=>p.name).filter(n=>!/clay jar/i.test(n));
function planFor(c){
  const n=c.name,k=c.kind,it=items(c);
  const P=(s,p)=>({s,p});
  const wax={col:'#f3e3b5',col2:'#d9bf84',vcol:'#f3e3b5'};
  switch(n){
   case'Reed Wick Candle':return [P('wick'),P('pour',wax),P('dip',wax)];
   case'Hush Candle':return [P('petals',{col:'#b59cd6',wax:'#f3e3b5'}),P('wick'),P('pour',wax)];
   case'Hearth Candle':return [P('stir',{col:'#d9bf84'}),P('pour',wax),P('dip',wax)];
   case'Memory Candle':return [P('petals',{col:'#9b6ad0',wax:'#f0e6d0'}),P('wick'),P('pour',wax),P('dip',wax)];
   case'Plantain Poultice':return [P('pestle'),P('wrap')];
   case'St John\'s Wort Oil':return [P('infuse'),P('pour',{col:'#c0392b',col2:'#7a1a14',vcol:'#c0392b',warm:false})];
   case'Rowan Cross':return [P('knot',{pat:'cross'}),P('wrap')];
   case'Hag Stone Charm':return [P('knot',{pat:'line9'})];
   case'Witch\'s Ladder':return [P('knot',{pat:'ladder'})];
   case'Witch Bottle':return [P('order',{items:['Iron Nail','Thistle','Sea Salt']}),P('pour',{col:'#e8e2da',col2:'#b8b0a8',vcol:'#e8e2da'})];
   case'Courage Sachet':case'Dream Pillow':return [P('pour',{col:'#8a9a5a',col2:'#5a6a3a',vcol:'#8a9a5a'}),P('knot',{pat:'bow',col:'#b05a8a'})];
   case'Finder\'s Pendulum':return [P('knot',{pat:'spiral',col:'#d98a4a'}),P('balance')];
   case'Fern Seed Charm':return [P('burn'),P('knot',{pat:'cross'})];
   case'Clay Jar':return [P('wheel')];
   case'Oak Gall Ink':return [P('grind'),P('color')];
   case'Feather Quill':return [P('carve')];
   case'Hazel Wand':return [P('carve'),P('knot',{pat:'spiral',col:'#d98a4a'})];
   case'Glowcap Lantern':return [P('place',{set:'glass'}),P('knot',{pat:'spiral',col:'#d98a4a'})];
   case'Story Lantern':return [P('place',{set:'glass'}),P('balance')];
   case'Calling Lantern':return [P('place',{set:'scale'}),P('balance')];
   case'Keeper\'s Lantern':return [P('place',{set:'glass'}),P('place',{set:'scale'}),P('balance')];
   case'Pearl Locket':return [P('knot',{pat:'spiral',col:'#d98a4a'}),P('knot',{pat:'bow',col:'#b05a8a'})];
   case'Wren\'s Key':return [P('place',{set:'key'}),P('knot',{pat:'spiral',col:'#d98a4a'})];
   case'Resin Incense':return [P('grind'),P('burn')];
   case'Saining Bundle':return [P('wrap'),P('burn')];
   case'Valerian Sleep Draught':return [P('kettle'),P('taste',{items:it}),P('stir',{col:'#8a6a3a'}),P('pour',{col:'#9a7a3a',col2:'#6a4a1a',vcol:'#9a7a3a'})];
   case'Marshmallow Cough Syrup':case'Hawthorn Heart Cordial':return [P('kettle'),P('taste',{items:it}),P('pour',{col:'#b3541e',col2:'#7a2a0a',vcol:'#b3541e',warm:true})];
  }
  if(k==='Brew'){const l=[P('kettle')];if(it.length>1)l.push(P('taste',{items:it}));l.push(P('stir',{col:'#a9742e'}));if(c.ingredients.match(/Clay Jar/))l.push(P('pour',{col:'#a9742e',col2:'#6a4414',vcol:'#a9742e'}));return l;}
  if(k==='Salve')return [P('infuse'),P('pour',{col:'#e0b95a',col2:'#a8832e',vcol:'#e0b95a',warm:true})];
  if(k==='Candle')return [P('wick'),P('pour',wax)];
  if(k==='Charm')return [P('knot',{pat:'line9'})];
  if(k==='Incense')return [P('grind'),P('burn')];
  if(k==='Lantern')return [P('place',{set:'glass'}),P('balance')];
  return [P('knot',{pat:'spiral'}),P('place',{set:'glass'})];
}

let CR=null;
function craftClose(){if(!CR)return;cancelAnimationFrame(CR.raf);document.removeEventListener('keydown',CR.kd);CR=null;const l=document.getElementById('mglayer');if(l)l.innerHTML='';}
window.abortCraft=craftClose;
window.craftPlay=function(c,done){
  craftClose();const plan=window.__forcePlan||planFor(c);let idx=0,scores=[];
  const L=document.getElementById('mglayer')||(()=>{const l=document.createElement('div');l.id='mglayer';l.style.cssText='position:fixed;inset:0;z-index:90';document.body.appendChild(l);return l;})();
  L.innerHTML=`<div class="scrim"><div class="cmwrap"><div class="cmhead"><div class="eyebrow">${esc(c.name)}</div><h2 id="cmt"></h2><p class="note" id="cmh"></p></div><canvas id="cmc" width="${W}" height="${H}"></canvas><div class="cmfoot"><span id="cmp"></span><span class="am-sp"></span><button class="btn sm" id="cmskip">Just make it plainly</button><button class="btn sm" id="cmcancel">Cancel</button></div></div></div>`;
  const cv=L.querySelector('#cmc'),ctx=cv.getContext('2d');CR={raf:0};
  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];};
  let g=null,def=null,endT=0;
  function pips(){L.querySelector('#cmp').innerHTML=plan.map((_,i)=>`<i style="display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;background:${i<idx?'#f0c674':i===idx?'#fff4c8':'rgba(255,255,255,.2)'}"></i>`).join('')+`<span style="opacity:.7">Step ${Math.min(idx+1,plan.length)} of ${plan.length}</span>`;}
  function start(){
    if(idx>=plan.length){const avg=scores.reduce((a,b)=>a+b,0)/scores.length;craftClose();done(avg);return;}
    const s=plan[idx];def=ST[s.s];g={p:s.p||{},t:0,d:clamp((S.level-1)/4,0,1),down:false,px:W/2,py:260,ended:false,motes:Array.from({length:26},()=>({x:rr(0,W),y:rr(0,H),s:rr(.4,1.4),r:rr(1,2.4),p:rr(0,6)})),banner:null,
      end(sc){if(g.ended)return;g.ended=true;g.score=sc;endT=0;const lab=sc>=.9?'Perfect':sc>=.72?'Lovely':sc>=.4?'Good':'Rough';g.banner={txt:lab,col:sc>=.72?'#9ad6a8':sc>=.4?GOLD:'#e58585'};}};
    L.querySelector('#cmt').textContent=def.t;L.querySelector('#cmh').textContent=def.h;pips();if(def.init)def.init(g);
  }
  let last=performance.now();
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;if(!CR)return;g.t+=dt;ctx.clearRect(0,0,W,H);bench(ctx,g);def.draw.call(def,g,ctx,dt);vignette(ctx);
    if(g.fl>0)g.fl-=dt;
    if(g.banner){endT+=dt;const a=clamp(endT/.25,0,1)*clamp((1.15-endT)/.3,0,1);ctx.save();ctx.globalAlpha=a;ctx.fillStyle='rgba(10,6,16,.55)';ctx.fillRect(0,H/2-60,W,110);ctx.font='700 64px "Cormorant Garamond",serif';ctx.textAlign='center';ctx.fillStyle=g.banner.col;ctx.shadowColor=g.banner.col;ctx.shadowBlur=24;ctx.fillText(g.banner.txt,W/2,H/2+20);ctx.restore();
      if(endT>1.15){scores.push(g.score);idx++;start();}}
    if(CR)CR.raf=requestAnimationFrame(frame);
  }
  cv.addEventListener('pointerdown',e=>{if(!g||g.ended)return;cv.setPointerCapture(e.pointerId);const [x,y]=pt(e);g.down=true;g.px=x;g.py=y;if(def.down)def.down.call(def,g,x,y);});
  cv.addEventListener('pointermove',e=>{if(!g)return;const [x,y]=pt(e);g.px=x;g.py=y;if(!g.ended&&def.move)def.move.call(def,g,x,y);});
  const upf=e=>{if(!g)return;const [x,y]=pt(e);g.down=false;if(!g.ended&&def.up)def.up.call(def,g,x,y);};
  cv.addEventListener('pointerup',upf);cv.addEventListener('pointercancel',upf);
  L.querySelector('#cmcancel').onclick=craftClose;L.querySelector('#cmskip').onclick=()=>{craftClose();done(.6);};
  CR.kd=e=>{if(e.key==='Escape')craftClose();};document.addEventListener('keydown',CR.kd);
  start();CR.raf=requestAnimationFrame(frame);
};
window.__craftStages=ST;window.__craftPlan=planFor;
})();

const ZLOOK={
 'Marsh':{base:'#1f3029',spk:['#2a4036','#18271f','#33452f','#2b2a1f','#223a33']},
 'Garden and hedgerow':{base:'#3b5c35',spk:['#456a3c','#34532f','#4d7243','#3f5e38']},

 'Town':{base:'#4a4352',spk:['#554d5e','#403a48','#5a5264','#3d3745']}
};
function ell(b,px,py,pad){return b.rect?(Math.abs(px-b.x)<b.rx+pad&&Math.abs(py-b.y)<b.ry+pad):(((px-b.x)/(b.rx+pad))**2+((py-b.y)/(b.ry+pad))**2<1);}
function blockedAt(px,py){const Z=ZN;if(px<30||py<60||px>Z.W-30||py>Z.H-20)return true;for(const b of Z.blk)if(ell(b,px,py,10))return true;if(Z.mask){for(const o of [[0,0],[9,0],[-9,0],[0,5],[0,-5],[6,6],[-6,6]])if(maskHit(Z.mask,px+o[0],py+o[1]))return true;}return false;}
function hue(n){let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h;}
function plantKind(name,zone){
  if(/reed|cattail|rush|sedge|bulrush/i.test(name))return'reed';
  if(/mushroom|fungus|moss|lichen|puffball|chaga/i.test(name))return'mush';
  if(zone==='Canal and shore'||zone==='Town')return'trinket';
  if(/lavender|violet|chamomile|yarrow|elder|rose|daisy|marigold|calendula|primrose|foxglove|mugwort|valerian|clover|vervain|heather|poppy|thistle|jasmine|honeysuckle|comfrey|st\.? john/i.test(name))return'flower';
  return'sprig';

  cam.x+=(tx-cam.x)*Math.min(1,dt*8);cam.y+=(ty-cam.y)*Math.min(1,dt*8);
  const cx=Math.round(cam.x),cy=Math.round(cam.y);
  c.fillStyle='#000';c.fillRect(0,0,SW,SH);c.save();c.scale(zm,zm);
  if(Z.tile){const T=Z.T;for(let tj=Math.max(0,Math.floor(cy/T));tj<=Math.min(Z.N-1,Math.floor((cy+vh-1)/T));tj++)for(let ti=Math.max(0,Math.floor(cx/T));ti<=Math.min(Z.N-1,Math.floor((cx+vw-1)/T));ti++)c.drawImage(Z.pad,1,1,T+2,T+2,ti*T-cx-1,tj*T-cy-1,T+2,T+2);}
  else c.drawImage(Z.bg,cx,cy,Math.min(vw,Z.W-cx),Math.min(vh,Z.H-cy),0,0,Math.min(vw,Z.W-cx),Math.min(vh,Z.H-cy));
