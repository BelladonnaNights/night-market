  list.push({y:P.y,f:()=>drawHero(c,P.x,P.y,P,t)});
  list.sort((a,b)=>a.y-b.y).forEach(i=>i.f());
  // mist & fireflies in world
  if(Z.z==='Marsh'||Z.z==='Woods'){for(let i=0;i<8;i++){const mx=((i*370+t*14)%(Z.W+600))-300,my=300+i*130;const g=c.createRadialGradient(mx,my,10,mx,my,260);g.addColorStop(0,'rgba(210,235,235,.11)');g.addColorStop(1,'rgba(210,235,235,0)');c.fillStyle=g;c.fillRect(mx-260,my-260,520,520);}}
  Z.flies.forEach(f=>{const fx=f.x+Math.sin(t*f.s+f.p)*30,fy=f.y+Math.cos(t*f.s*.8+f.p)*22,a=.5+.5*Math.sin(t*2+f.p);if(fx<cx-20||fx>cx+vw+20||fy<cy-20||fy>cy+vh+20)return;const g=c.createRadialGradient(fx,fy,0,fx,fy,9);g.addColorStop(0,'rgba(255,240,150,'+(.9*a)+')');g.addColorStop(1,'rgba(255,240,150,0)');c.fillStyle=g;c.fillRect(fx-9,fy-9,18,18);});
  Z.float=Z.float.filter(f=>(f.life-=dt)>0);Z.float.forEach(f=>{c.globalAlpha=Math.min(1,f.life);c.fillStyle='#ffe9a6';c.font='700 15px Nunito Sans, sans-serif';c.textAlign='center';c.fillText('+ '+f.txt,f.x,f.y-(1.8-f.life)*30);c.globalAlpha=1;});
  c.restore();c.restore();
  // lighting
  const dusk=S.phase!=='day';
  c.fillStyle=dusk?'rgba(40,14,70,.22)':'rgba(255,230,180,.05)';c.fillRect(0,0,SW,SH);
  const sx=(P.x-cx)*zm,sy=(P.y-cy)*zm-30,vg=c.createRadialGradient(sx,sy,SH*(dusk?.18:.4),sx,sy,SH*(dusk?.85:1.05));vg.addColorStop(0,'rgba(5,3,12,0)');vg.addColorStop(1,'rgba(5,3,12,'+(dusk?.7:.4)+')');c.fillStyle=vg;c.fillRect(0,0,SW,vh);
  const lg=c.createRadialGradient(sx+P.face*16,sy+14,2,sx+P.face*16,sy+14,150);lg.addColorStop(0,'rgba(255,214,130,'+(dusk?.28:.1)+')');lg.addColorStop(1,'rgba(255,214,130,0)');c.fillStyle=lg;c.fillRect(sx-170,sy-150,360,360);
  if(Z.tile){const ms=150,mx=SW-ms-14,my=SH-ms-14,k=ms/Z.W;c.fillStyle='rgba(10,6,18,.62)';c.fillRect(mx,my,ms,ms);c.strokeStyle='rgba(240,198,116,.6)';c.lineWidth=1.5;c.strokeRect(mx,my,ms,ms);
    c.fillStyle='rgba(240,198,116,.9)';Z.nodes.forEach(n=>{if(!n.done)c.fillRect(mx+n.x*k-1.5,my+n.y*k-1.5,3,3);});c.strokeStyle='rgba(255,255,255,.35)';c.strokeRect(mx+cx*k,my+cy*k,vw*k,vh*k);c.fillStyle='#fff';c.beginPath();c.arc(mx+P.x*k,my+P.y*k,3.2,0,7);c.fill();}
  // hud
  const h=$('#zhint'),f=$('#zfound');
  if(h){if(near&&!MG){h.style.display='block';h.textContent='E · Gather '+near.name;}else h.style.display='none';}
  if(f){const left=Z.nodes.filter(n=>!n.done).length;f.textContent=Z.got.length?('Gathered: '+Z.got.join(', ')+' · '+left+' left'):'WASD to walk · Shift to run · E or click to gather · wheel or +/- to zoom · '+left+' things nearby';if(/debug/.test(location.search)){const hs=heroSprite(P,t);f.textContent+=' | DEBUG sprite='+(hs?'yes':'NO')+' idleImg='+(itemUrl('x_azlynn_idle')?'yes':'NO')+' size='+(charScale('azlynn')==null?'unset':Math.round(charScale('azlynn')*100)+'%')+' assets='+AS.tree.length+' slots='+Object.keys(AS.slots).length+' cloudRev='+AS.rev;}}
}

/* ===== asset library + scene composer ===== */
const DIMS={screen:[1920,1080],map:[2200,1500],portrait:[1200,1800],tile:[1024,1024],square:[1600,1600]};
const dimsOf=id=>{const s=AS.scenes[id];return DIMS[(s&&s.size)||'screen']||DIMS.screen;};
const AS={imgs:{},rev:0,tree:[],scenes:{},slots:{},urls:{},ready:false,sel:null,scene:null,layer:null,cur:null,open:new Set(),phase:'night',remote:false};
const uid=()=>Math.random().toString(36).slice(2,9);
const IMGX=/^(png|jpe?g|webp|gif|svg|avif)$/,MODX=/^(glb|gltf)$/,AUDX=/^(mp3|ogg|wav|m4a)$/;
let _db=null;
function idb(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open('nm-assets',1);r.onupgradeneeded=()=>{r.result.createObjectStore('files');r.result.createObjectStore('meta');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));}
async function dbx(store,mode,fn){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(store,mode),q=fn(t.objectStore(store));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);});}
const dbGet=(s,k)=>dbx(s,'readonly',o=>o.get(k)),dbPut=(s,k,v)=>dbx(s,'readwrite',o=>o.put(v,k)),dbDel=(s,k)=>dbx(s,'readwrite',o=>o.delete(k));
let _sv=null;function saveMeta(){clearTimeout(_sv);return dbPut('meta','state',{tree:AS.tree,scenes:AS.scenes,slots:AS.slots}).catch(()=>toast('Could not save assets (browser storage blocked?)'));}
function saveSoon(){clearTimeout(_sv);_sv=setTimeout(saveMeta,400);}
const DBU='https://night-market-7d13a-default-rtdb.firebaseio.com';
async function jget(path,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||8000);try{const r=await fetch(DBU+'/'+path+'.json',{signal:c.signal});if(!r.ok)return null;return await r.json();}catch(e){return null;}finally{clearTimeout(t);}}
function unb64(s,ext){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const M={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',svg:'image/svg+xml',avif:'image/avif',glb:'model/gltf-binary',mp3:'audio/mpeg',ogg:'audio/ogg',wav:'audio/wav',m4a:'audio/mp4'};return new Blob([u],{type:M[ext]||'application/octet-stream'});}
async function fetchAssetFile(n){try{const o=await jget('assetfiles/'+n.id,20000);if(o&&o.d){const b=unb64(o.d,o.e||n.ext);await dbPut('files',n.id,b);AS.urls[n.id]=URL.createObjectURL(b);return true;}}catch(e){}return false;}
async function assetsLoad(){
  let st=null;
  try{st=await dbGet('meta','state');if(st){AS.tree=st.tree||[];AS.scenes=st.scenes||{};AS.slots=st.slots||{};AS.rev=st.rev||0;}
    for(const n of AS.tree)if(n.type==='asset'){if(n.url){AS.urls[n.id]=n.url;continue;}const b=await dbGet('files',n.id);if(b)AS.urls[n.id]=URL.createObjectURL(b);}}catch(e){}
  // newest copy lives in the cloud (saved from the Game Book's Assets tab)
  const cl=await jget('assetmeta',6000);
  if(cl&&cl.json&&(cl.rev||0)>(AS.rev||0)){try{const m=JSON.parse(cl.json);AS.tree=m.tree||[];AS.scenes=m.scenes||{};AS.slots=m.slots||{};AS.rev=cl.rev;
    await dbPut('meta','state',Object.assign({},st||{},{tree:AS.tree,scenes:AS.scenes,slots:AS.slots,rev:cl.rev,cloudRev:cl.rev}));}catch(e){}}
  // fetch what the title and stall screens need first, the rest quietly in the background
  const need=new Set();['title','stall','stall_sunrise','stall_day','stall_dusk','stall_night'].forEach(k=>{const sc=AS.scenes[AS.slots[k]];if(sc)sc.layers.forEach(l=>{if(l.asset)need.add(l.asset);});});
  AS.tree.forEach(n=>{if(n.type==='asset'&&n.url)AS.urls[n.id]=n.url;});
  const missing=AS.tree.filter(n=>n.type==='asset'&&!n.ph&&!AS.urls[n.id]);
  const first=missing.filter(n=>need.has(n.id)),rest=missing.filter(n=>!need.has(n.id));
  await Promise.all(first.map(fetchAssetFile));
  (async()=>{for(const n of rest)await fetchAssetFile(n);})();
  if(!AS.tree.length){try{const r=await fetch('assets/manifest.json',{cache:'no-cache'});if(r.ok){const m=await r.json();AS.tree=m.tree||[];AS.scenes=m.scenes||{};AS.slots=m.slots||{};for(const n of AS.tree)if(n.type==='asset')AS.urls[n.id]='assets/'+n.path;}}catch(e){}}
  AS.tree.forEach(n=>{if(n.type==='asset'){const k='x_'+n.name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');if(/^x_azlynn_/.test(k)&&!AS.slots['item_'+k])AS.slots['item_'+k]=n.id;}});
  AS.ready=true;
}
/* ----- tree helpers ----- */
const node=id=>AS.tree.find(n=>n.id===id);
const kids=p=>AS.tree.filter(n=>(n.parent||null)===(p||null)).sort((a,b)=>a.order-b.order);
const nextOrder=p=>kids(p).reduce((m,n)=>Math.max(m,n.order),0)+1;
function isUnder(id,anc){let n=node(id);while(n){if(n.id===anc)return true;n=n.parent?node(n.parent):null;}return false;}
function renum(p){kids(p).forEach((n,i)=>n.order=i+1);}
function moveNode(id,newParent,beforeId){
  const n=node(id);if(!n||id===beforeId)return;if(newParent&&(newParent===id||isUnder(newParent,id)))return;
  const old=n.parent||null;n.parent=newParent||null;
  if(beforeId){const b=node(beforeId);n.order=b.order-.5;}else n.order=nextOrder(newParent)+1;
  renum(newParent||null);if(old!==(newParent||null))renum(old);saveMeta();
}
function delNode(id){
  const n=node(id);if(!n)return;
  if(n.type==='folder')kids(id).forEach(k=>delNode(k.id));
  if(n.type==='asset'){dbDel('files',id);delete AS.urls[id];Object.values(AS.scenes).forEach(s=>s.layers=s.layers.filter(l=>l.asset!==id));}
  if(n.type==='scene'){delete AS.scenes[id];for(const k in AS.slots)if(AS.slots[k]===id)delete AS.slots[k];if(AS.scene===id)AS.scene=null;}
  AS.tree=AS.tree.filter(x=>x.id!==id);if(AS.sel===id)AS.sel=null;
}
async function addFiles(files,parent){
  let n=0;for(const f of files){const ext=(f.name.split('.').pop()||'').toLowerCase();
    if(!(IMGX.test(ext)||MODX.test(ext)||AUDX.test(ext))){toast('Skipped '+f.name+' (unsupported type)');continue;}
    const id=uid();let w=0,h=0;const url=URL.createObjectURL(f);
    if(IMGX.test(ext)){try{const im=new Image();im.src=url;await im.decode();w=im.naturalWidth;h=im.naturalHeight;}catch(e){}}
    await dbPut('files',id,f);AS.urls[id]=url;AS.tree.push({id,type:'asset',name:f.name.replace(/\.[^.]+$/,''),ext,parent:parent||null,order:nextOrder(parent),size:f.size,w,h});if(parent)AS.open.add(parent);AS.sel=id;AS.scene=null;n++;}
  if(n){await saveMeta();toast(n+' added');}amRender();
}
const kindOf=ext=>IMGX.test(ext)?'image':MODX.test(ext)?'3D model':'audio';
const fmtSz=b=>b>1e6?(b/1e6).toFixed(1)+' MB':Math.round(b/1e3)+' KB';

/* ----- scene rendering (used by the game AND the composer) ----- */
const rgba=(hex,a)=>{const h=(hex||'#ffd98a').replace('#','');const n=parseInt(h.length===3?h.replace(/./g,'$&$&'):h,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;};
function layerHtml(L,phase,editing){
  const vis=L.show==='all'||L.show===phase;if(!editing&&(L.hidden||!vis))return '';
  const fx=L.fx&&L.fx!=='none'?'fx-'+L.fx:'',dur=(5.2-(L.fxs==null?50:L.fxs)/25).toFixed(2);
  let inner='';
  if(L.kind==='glow')inner=`<div class="lyi ${fx}" style="width:${L.size}px;height:${L.size}px;border-radius:50%;background:radial-gradient(circle,${rgba(L.color,.95)} 0%,${rgba(L.color,.4)} 38%,${rgba(L.color,0)} 70%)"></div>`;
  else if(L.kind==='flies'){const r=seeded(L.id);let d='';for(let i=0;i<(L.count||18);i++)d+=`<i style="left:${r()*100}%;top:${r()*100}%;animation-delay:-${(r()*9).toFixed(1)}s;animation-duration:${(5+r()*6).toFixed(1)}s"></i>`;inner=`<div class="lyi flies" style="width:1920px;height:1080px;--c:${L.color||'#ffe9a6'}">${d}</div>`;}
  else{const u=AS.urls[L.asset];inner=u?`<img class="lyi ${fx}" src="${u}" draggable="false" alt="">`:`<div class="lyi" style="width:200px;height:120px;border:2px dashed #e58585;color:#e58585;display:grid;place-items:center;font:700 14px sans-serif">missing image</div>`;}
  const off=(L.hidden||!vis)?'opacity:.22;':'opacity:'+(L.op==null?1:L.op)+';';
  return `<div class="ly ${editing&&AS.layer===L.id?'sel':''}" data-lid="${L.id}" style="left:${L.x}px;top:${L.y}px;transform:translate(-50%,-50%) rotate(${L.rot||0}deg) scale(${(L.s==null?100:L.s)/100*(L.flip?-1:1)},${(L.s==null?100:L.s)/100});${off}mix-blend-mode:${L.blend||'normal'};--a:${(L.fxa==null?50:L.fxa)/100};--d:${dur}s;${editing?'':'pointer-events:none'}">${inner}</div>`;
}
function stageHtml(id,phase,editing,clear){const S0=AS.scenes[id];if(!S0)return '';const [W,H]=dimsOf(id);return `<div class="stage" data-w="${W}" data-h="${H}"><div class="st" style="width:${W}px;height:${H}px;background:${clear?'transparent':(S0.bg||'#0e0916')}">${S0.layers.map(l=>layerHtml(l,phase,editing)).join('')}</div></div>`;}
/* ----- item art: images the Game Book's Item art window attached to game items ----- */

function charSpeed(ch){const n=AS.tree.find(x=>x.type==='asset'&&x.name===ch+'_portrait_full'),v=n&&parseFloat(AS.slots['assetspd_'+n.id]);return v>0?v/100:1;}
function charScale(ch){const n=AS.tree.find(x=>x.type==='asset'&&x.name===ch+'_portrait_full'),v=n&&parseFloat(AS.slots['assetsz_'+n.id]);return v>0?v/100:null;}
function stallScene(ph){const k=ph==='day'?(S.tmp&&S.tmp.dawn?'stall_sunrise':'stall_day'):'stall_'+ph;return slotScene(k)||slotScene('stall_'+ph)||slotScene('stall');}
function counterScene(){const a=stallScene(S.phase);if(a&&AS.scenes[a].counter&&AS.scenes[a].counter.length)return a;for(const k of ['stall','stall_night','stall_dusk','stall_day','stall_sunrise']){const i=slotScene(k);if(i&&AS.scenes[i].counter&&AS.scenes[i].counter.length)return i;}return a;}
function custFlip(c){const rq=D.requests.find(r=>r.id===(c&&c.id))||D.requests.find(r=>r.name===(c&&c.name));if(!rq)return false;const x=AS.slots['item_'+rq.id];return !!(x&&AS.slots['assetflip_'+x]);}
function custScale(c){const rq=D.requests.find(r=>r.id===(c&&c.id))||D.requests.find(r=>r.name===(c&&c.name));if(!rq)return 1;let v=parseFloat(AS.slots['itemsz_'+rq.id]);if(!(v>0)){const x=AS.slots['item_'+rq.id];v=parseFloat(AS.slots['assetsz_'+x]);}return v>0?v/100:1;}

function openCutout(){
  const n=node(AS.sel);if(!n)return;const m=document.createElement('div');m.id='am-cut';m.className='scrim';m.style.zIndex=300;
  m.innerHTML=`<div class="modal" style="width:min(900px,96vw)"><h2>Remove background</h2><div class="note" style="margin:6px 0">Picks the colour in the corners and makes it transparent. Works best on a plain flat background (white, black, or bright green).</div>
  <div class="fld"><label>Strength <span id="cutv">40</span></label><input type="range" id="cutt" min="5" max="140" value="40"></div>
  <label class="chip"><input type="checkbox" id="cutall"> also remove matching colour inside the picture</label>
  <div style="margin:12px 0;max-height:52vh;overflow:auto;background:repeating-conic-gradient(#2a2038 0 25%,#1c1428 0 50%) 0 0/24px 24px;border-radius:12px;text-align:center"><canvas id="cutc" style="max-width:100%"></canvas></div>
  <div class="actions"><button class="btn gold" id="cutok">Apply</button><button class="btn" id="cutno">Cancel</button></div></div>`;
  document.body.appendChild(m);
  const im=new Image();im.onload=()=>{const c=document.getElementById('cutc'),x=c.getContext('2d',{willReadFrequently:true});c.width=im.naturalWidth;c.height=im.naturalHeight;x.drawImage(im,0,0);const src=x.getImageData(0,0,c.width,c.height);
    const run=()=>{const tol=+document.getElementById('cutt').value,all=document.getElementById('cutall').checked;document.getElementById('cutv').textContent=tol;const W=c.width,H=c.height,d=new Uint8ClampedArray(src.data),px=(i)=>[d[i*4],d[i*4+1],d[i*4+2]];
      const cs=[0,W-1,(H-1)*W,H*W-1].map(px),bc=[0,1,2].map(k=>Math.round(cs.reduce((a,v)=>a+v[k],0)/4));
      const near=i=>Math.hypot(d[i*4]-bc[0],d[i*4+1]-bc[1],d[i*4+2]-bc[2])<=tol;
      if(all){for(let i=0;i<W*H;i++)if(near(i))d[i*4+3]=0;}
      else{const seen=new Uint8Array(W*H),q=[];const push=i=>{if(!seen[i]&&near(i)){seen[i]=1;q.push(i);}};for(let x2=0;x2<W;x2++){push(x2);push((H-1)*W+x2);}for(let y=0;y<H;y++){push(y*W);push(y*W+W-1);}
        while(q.length){const i=q.pop(),x2=i%W,y=(i/W)|0;d[i*4+3]=0;if(x2>0)push(i-1);if(x2<W-1)push(i+1);if(y>0)push(i-W);if(y<H-1)push(i+W);}}
      x.putImageData(new ImageData(d,W,H),0,0);};
    document.getElementById('cutt').oninput=run;document.getElementById('cutall').onchange=run;run();
    document.getElementById('cutno').onclick=()=>m.remove();
    document.getElementById('cutok').onclick=()=>{c.toBlob(async b=>{await dbPut('files',n.id,b);AS.urls[n.id]=URL.createObjectURL(b);n.ext='png';n.size=b.size;n.w=c.width;n.h=c.height;await saveMeta();m.remove();stageRefresh();amRender();toast('Background removed');},'image/png');};};
  im.src=AS.urls[n.id];
}

/* ----- export zip for GitHub ----- */
const CRCT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crcb=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
function zipBin(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  files.forEach(f=>{const nm=enc.encode(f.name),d=f.data,c=crcb(d);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(33),...u32(c),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,d);cd.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(33),...u32(c),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);off+=lh.length+nm.length+d.length;});
  let cs=0;cd.forEach(c=>cs+=c.length);const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);
  return new Blob([...parts,...cd,end],{type:'application/zip'});
}
async function exportAssets(){
  const safe=s=>String(s).replace(/[^\w\- .]+/g,'_').trim()||'x',used=new Set(),files=[],tree=[];
  const pathOf=n=>{const seg=[];let c=n;while(c){seg.unshift(safe(c.name));c=c.parent?node(c.parent):null;}return seg.join('/');};
  for(const n of AS.tree){const o=Object.assign({},n);if(n.type==='asset'){let p=pathOf(n)+'.'+n.ext,i=1;while(used.has(p.toLowerCase()))p=pathOf(n)+'-'+(i++)+'.'+n.ext;used.add(p.toLowerCase());o.path=p;const b=await dbGet('files',n.id);if(b)files.push({name:'assets/'+p,data:new Uint8Array(await b.arrayBuffer())});}tree.push(o);}
  files.unshift({name:'assets/manifest.json',data:new TextEncoder().encode(JSON.stringify({v:1,tree,scenes:AS.scenes,slots:AS.slots},null,1))});
  const l=document.createElement('a');l.href=URL.createObjectURL(zipBin(files));l.download='night-market-assets.zip';l.click();toast('Unzip next to your index.html (it makes an “assets” folder)');
}

/* ===== admin: jump anywhere. Open with ?admin in the URL (or localStorage nm-admin=1). ===== */
function renderAdmin(){
  const gat=D.gathers.map(g=>g.name),cr=D.crafts.map(c=>c.name);
  const opt=(arr,sel)=>arr.map(n=>`<option ${n===sel?'selected':''}>${esc(n)}</option>`).join('');
  const broken=[];D.crafts.concat(D.upgrades).forEach(x=>parseIng(x.ingredients).forEach(p=>{if(!p.r)broken.push(x.name+' needs '+p.name);}));
  D.requests.forEach(r=>{if(parseIng(r.answer).some(p=>!p.r))broken.push('Request '+r.name+': '+r.answer);});
  openModal(`${X}<div class="eyebrow">Admin</div><h2>Jump anywhere</h2><div class="adm" style="margin-top:12px">
  <section><h3>Time</h3><div class="row"><div class="fld"><label>Day</label><input id="a-day" type="number" min="1" value="${S.day}" style="width:90px"></div><div class="fld"><label>Moon (from day)</label><input value="${moonOf(S.day)}" disabled style="width:100px"></div></div>
   <div class="row"><button class="btn sm" data-a="day">Set day</button><button class="btn sm" data-a="phase" data-v="day">Day</button><button class="btn sm" data-a="phase" data-v="dusk">Dusk</button><button class="btn sm" data-a="phase" data-v="night">Open stall (night)</button></div>
   <div class="row" style="margin-top:8px"><button class="btn sm" data-a="moon" data-v="1">Next moon phase</button><button class="btn sm" data-a="nextday">Skip to next day</button></div></section>
  <section><h3>Economy</h3><div class="row"><div class="fld"><label>Coins</label><input id="a-coins" type="number" value="${S.coins}" style="width:100px"></div><div class="fld"><label>Stall level</label><select id="a-lvl">${D.levels.map(l=>`<option value="${l.level}" ${l.level===S.level?'selected':''}>${l.level} · ${esc(l.name)}</option>`).join('')}</select></div></div>
   <button class="btn sm" data-a="econ">Apply</button> <button class="btn sm" data-a="maxall">Max everything</button></section>
  <section><h3>Give items</h3><div class="row"><div class="fld"><label>Item</label><select id="a-item">${opt(gat.concat(cr))}</select></div><div class="fld"><label>Qty</label><input id="a-qty" type="number" value="3" min="1" style="width:70px"></div><div class="fld"><label>Quality</label><select id="a-tier">${D.tiers.map(t=>`<option ${t.name==='Proper'?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div>
   <div class="row"><button class="btn sm" data-a="give">Give</button><button class="btn sm" data-a="giveall">All gatherables ×5</button><button class="btn sm danger" data-a="clearinv">Clear pack</button></div></section>
  <section><h3>Customers</h3><div class="fld"><label>Spawn at the counter now</label><select id="a-req">${opt(D.requests.map(r=>r.name))}</select></div>
   <div class="row"><button class="btn sm" data-a="spawn">Spawn</button><button class="btn sm" data-a="queue">Refill tonight’s queue</button><button class="btn sm" data-a="walkin">Walk-in</button></div></section>
  <section><h3>Story</h3><div class="fld"><label>Play a scene</label><select id="a-scene">${opt(Object.keys(SCENES))}</select></div>
   <div class="row"><button class="btn sm" data-a="scene">Play</button><button class="btn sm" data-a="n1done">Mark Night One done</button><button class="btn sm" data-a="n1reset">Reset Night One</button></div>
   <div class="row" style="margin-top:8px"><div class="fld"><label>Set flag</label><input id="a-flag" placeholder="flag_name"></div><button class="btn sm" data-a="flag">Set</button><button class="btn sm" data-a="unflag">Clear</button></div>
   <div class="row"><div class="fld"><label>Relationship</label><input id="a-rel" placeholder="wren"></div><div class="fld"><label>+/-</label><input id="a-reln" type="number" value="1" style="width:60px"></div><button class="btn sm" data-a="rel">Add</button></div>
   <div class="note" style="margin-top:8px;font-size:12px">Flags: ${esc(Object.keys(S.flags).join(', ')||'none')} · Rel: ${esc(JSON.stringify(S.rel))}</div></section>
  <section><h3>Rules</h3><div class="row"><button class="tab ${S.mode==='cozy'?'on':''}" data-a="mode" data-v="cozy">Cozy</button><button class="tab ${S.mode==='almanac'?'on':''}" data-a="mode" data-v="almanac">Almanac</button></div>
   <div class="lbl" style="margin:10px 0 4px">Strict in Almanac mode</div><div class="row">${Object.keys(S.strict).map(k=>`<button class="tab ${S.strict[k]?'on':''}" data-a="strict" data-v="${esc(k)}">${esc(k)}</button>`).join('')}</div></section>
  <section><h3>Game Book data</h3><div class="note" style="font-size:12.5px">Source: <b>${DATAINFO.source}</b> · rev ${DATAINFO.rev}<br>Cloud rev: ${DATAINFO.cloudRev||'unknown'}${DATAINFO.error?'<br><span style="color:var(--bad)">'+esc(DATAINFO.error)+'</span>':''}<br>${D.gathers.length} gatherables · ${D.crafts.length} recipes · ${D.requests.length} customers</div>
   <div class="row" style="margin-top:8px"><button class="btn sm" data-a="refresh">Refresh from cloud</button></div>
   <div class="note" style="margin-top:8px;font-size:12.5px;${broken.length?'border-color:rgba(229,133,133,.4)':''}">${broken.length?broken.slice(0,8).map(esc).join('<br>')+(broken.length>8?'<br>…':''):'Every ingredient resolves.'}</div></section>
  <section><h3>Save</h3><div class="row"><button class="btn sm" data-a="exp">Export save</button><label class="btn sm" style="cursor:pointer">Import<input type="file" id="a-imp" accept=".json" hidden></label><button class="btn sm danger" data-a="wipe">Wipe save</button></div></section>
  </div>`);
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-a]');if(!t)return;e.preventDefault();
  const a=t.dataset.a,v=t.dataset.v,val=id=>$('#'+id).value;
  const again=()=>{save();render();renderAdmin();};
  switch(a){
    case'day':S.day=Math.max(1,parseInt(val('a-day'))||1);again();break;
    case'phase':if(v==='night'){closeModal();openStall();}else{setPhase(v);renderAdmin();}break;
    case'moon':S.day+=2;again();break;
    case'nextday':advanceDay();renderAdmin();break;
    case'econ':S.coins=parseInt(val('a-coins'))||0;S.level=parseInt(val('a-lvl'))||1;if(S.earned<LEVEL_EARN[S.level-1])S.earned=LEVEL_EARN[S.level-1];again();break;
    case'maxall':S.coins=9999;S.level=D.levels.length||5;S.earned=LEVEL_EARN[LEVEL_EARN.length-1];D.gathers.forEach(g=>addItem(g.name,5));again();break;
    case'give':addItem(val('a-item'),parseInt(val('a-qty'))||1,val('a-tier'));again();break;
    case'giveall':D.gathers.forEach(g=>addItem(g.name,5));again();break;
    case'clearinv':S.inv={};again();break;
    case'spawn':{const r=D.requests.find(x=>x.name===val('a-req'));if(r){S.phase='night';S.queue=S.cur?[S.cur].concat(S.queue):S.queue;S.cur=makeCustomer(r);S.tmp.sel=[];S.tmp.react=null;S.tmp.fresh=true;closeModal();save();render();}break;}
    case'queue':S.phase='night';S.queue=buildQueue();closeModal();nextCustomer();break;
    case'walkin':{const w=walkIn();if(w){S.phase='night';S.cur=w;S.tmp.sel=[];S.tmp.react=null;S.tmp.fresh=true;closeModal();save();render();}break;}
    case'scene':closeModal();playScene(val('a-scene'),()=>render());break;
    case'n1done':S.flags.night_one_done=true;['met_wren','opened_almanac','gathered','wren_gave','crafted_candle','moth_served'].forEach(f=>S.flags[f]=true);again();break;
    case'n1reset':['night_one_done','met_wren','opened_almanac','gathered','wren_gave','crafted_candle','moth_served'].forEach(f=>delete S.flags[f]);S.day=1;S.phase='dusk';S.inv={};S.coins=0;S.earned=0;S.level=1;S.sold=0;S.queue=[];S.cur=null;again();break;
    case'flag':if(val('a-flag')){S.flags[val('a-flag').trim()]=true;again();}break;
    case'unflag':delete S.flags[val('a-flag').trim()];again();break;
    case'rel':if(val('a-rel')){S.rel[val('a-rel').trim().toLowerCase()]=(S.rel[val('a-rel').trim().toLowerCase()]||0)+(parseInt(val('a-reln'))||0);again();}break;
    case'mode':S.mode=v;again();break;
    case'strict':S.strict[v]=!S.strict[v];again();break;
    case'refresh':DATAINFO.force=true;toast('Checking the cloud…');await fetchCloud();DATAINFO.force=false;toast('Data: '+DATAINFO.source);render();renderAdmin();break;
    case'exp':{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='night-market-save.json';l.click();break;}
    case'wipe':if(confirm('Wipe the save?')){localStorage.removeItem(SAVE_KEY);S=DEFAULT();closeModal();render();}break;
  }
});
document.addEventListener('change',e=>{if(e.target.id==='a-imp'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(v.v!==1)throw 0;S=Object.assign(DEFAULT(),v);S.started=true;save();render();renderAdmin();toast('Save imported');}catch(x){toast('Not a Night Market save');}};r.readAsText(e.target.files[0]);}});
document.addEventListener('keydown',e=>{if(ADMIN&&e.shiftKey&&e.key==='A'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();renderAdmin();}if(e.key==='f'&&!e.ctrlKey&&!e.metaKey&&!ZN&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&S.started&&!VN){toggleFS();}
  if(e.key==='Escape'){if(MG){abortMini();return;}if(ZN){leaveZone();return;}if(!VN)closeModal();}});

/* ===== boot ===== */
(async function boot(){
  loadEmbedded();
  try{await assetsLoad();}catch(e){}
  SCENES=parseScenes($('#scenes').textContent);
  const had=load();if(had&&S.started){/* keep */}
  render();
  const changed=await fetchCloud();
  if(changed){toast('Game Book updated from the cloud');if(S.started&&!VN&&!$('#overlay').firstChild)render();}
})();
window.NM={get S(){return S;},get D(){return D;},render,playScene,openStall,craft,offer,forage,closeNight,advanceDay,addItem,SCENES:()=>SCENES,fetchCloud};
