<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Night Market · Game Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0916; --bg2:#150f20; --card:#1b1327; --card2:#251a35; --raise:#2d2142;
  --line:rgba(240,198,116,.14); --line2:rgba(240,198,116,.38);
  --gold:#f0c674; --amber:#e8a33d; --plum:#8a5aae; --rose:#d98fa8;
  --text:#f2e9db; --muted:#ab9ec0; --faint:#7d7092; --ok:#7fc8a0; --bad:#e58585;
  --serif:'Cormorant Garamond','Cormorant',Georgia,'Times New Roman',serif;
  --sans:'Nunito Sans','Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(900px 600px at 10% -8%,rgba(232,163,61,.16),transparent 62%),
   radial-gradient(800px 700px at 105% 105%,rgba(138,90,174,.22),transparent 62%),
   radial-gradient(600px 500px at 60% 40%,rgba(217,143,168,.05),transparent 70%),
   linear-gradient(180deg,#0e0916,#130c1d)}
::selection{background:rgba(240,198,116,.3)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--text)}
a{color:var(--gold)}
.ico{flex:none;vertical-align:middle}

/* fireflies */
#flies{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fly{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe3a0;box-shadow:0 0 10px 3px rgba(255,214,130,.55);opacity:0;animation:fly var(--d) ease-in-out var(--dl) infinite}
@keyframes fly{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}50%{opacity:.35;transform:translate(var(--x),var(--y))}85%{opacity:.9}100%{opacity:0;transform:translate(calc(var(--x)*-.4),calc(var(--y)*1.5))}}
@media (prefers-reduced-motion:reduce){.fly{animation:none;opacity:.35}*{transition:none!important}}

/* shell */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
aside.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:26px 18px 18px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(21,15,32,.85),rgba(14,9,22,.92));backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:13px;padding:4px 8px 22px}
.brand .moon{width:44px;height:44px;flex:none;filter:drop-shadow(0 0 14px rgba(240,198,116,.45))}
.brand .t{font:700 25px/1.05 var(--serif);letter-spacing:.01em;color:var(--text)}
.brand .s{font:800 10.5px/1 var(--sans);letter-spacing:.34em;color:var(--gold);margin-top:7px;text-transform:uppercase}
nav.nav{display:flex;flex-direction:column;gap:3px;overflow:auto}
.nav button{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:13px;color:var(--muted);font-weight:700;text-align:left;position:relative;transition:.18s}
.nav button:hover{background:rgba(240,198,116,.06);color:var(--text)}
.nav button.on{color:var(--gold);background:linear-gradient(90deg,rgba(240,198,116,.17),rgba(240,198,116,.02))}
.nav button.on::before{content:"";position:absolute;left:-18px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.nav .n{margin-left:auto;font-size:12px;font-weight:800;color:var(--faint);background:rgba(255,255,255,.05);padding:1px 9px;border-radius:99px}
.nav button.on .n{color:#1b1327;background:var(--gold)}
.side .foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px}
.side .foot b{color:var(--muted)}

.main{min-width:0}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 34px;background:rgba(14,9,22,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;padding:0 16px;height:44px;border-radius:99px;background:rgba(255,255,255,.045);border:1px solid var(--line);color:var(--muted);transition:.18s}
.search:focus-within{border-color:var(--line2);box-shadow:0 0 0 4px rgba(240,198,116,.08);background:rgba(255,255,255,.06)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%}
.search input::placeholder{color:var(--faint)}
.search kbd{font:700 11px var(--sans);color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 17px;border-radius:99px;font-weight:800;font-size:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);transition:.18s;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:rgba(240,198,116,.08)}
.btn.gold{border:0;color:#2a1a08;background:linear-gradient(135deg,#f6d98c,#e8a33d);box-shadow:0 6px 22px rgba(232,163,61,.28)}
.btn.gold:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn.sm{height:34px;padding:0 13px;font-size:13px}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:rgba(229,133,133,.3)}
.btn.danger:hover{background:rgba(229,133,133,.1);border-color:var(--bad)}
.btn.on{background:rgba(240,198,116,.16);border-color:var(--line2);color:var(--gold)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.switch{width:34px;height:19px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s}
.btn.on .switch{background:var(--gold)}.btn.on .switch::after{left:17px;background:#2a1a08}

.page{padding:38px 34px 90px;max-width:1380px}
.pagehead{margin-bottom:26px}
.eyebrow{font:800 11px var(--sans);letter-spacing:.3em;color:var(--gold);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.eyebrow::after{content:"";height:1px;width:56px;background:linear-gradient(90deg,var(--gold),transparent)}
h1.title{font:700 clamp(40px,5.2vw,64px)/1.02 var(--serif);margin:10px 0 8px;letter-spacing:-.005em;background:linear-gradient(180deg,#fff3d6,#f0c674 70%,#d99a3e);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.latin{font:italic 500 16px var(--serif);color:var(--faint);margin-top:-6px;position:relative;z-index:1}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.blurb{color:var(--muted);font-size:17px;max-width:720px;margin:0}
h2.sec{font:700 30px/1.1 var(--serif);margin:42px 0 16px;display:flex;align-items:center;gap:14px;color:var(--text)}
h2.sec .l{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
h2.sec small{font:800 12px var(--sans);letter-spacing:.14em;color:var(--faint);text-transform:uppercase}

/* chips */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 22px}
.tgroup{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.tlabel{font:800 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-right:4px}
.fchip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:13.5px;transition:.16s;background:rgba(255,255,255,.03)}
.fchip:hover{border-color:var(--line2);color:var(--text)}
.fchip.on{background:var(--gold);color:#2a1a08;border-color:var(--gold)}
.fchip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--gold));display:block;box-shadow:0 0 8px var(--c,transparent)}
.fchip.on i{box-shadow:none;outline:2px solid rgba(42,26,8,.35)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:rgba(255,255,255,.03)}
.seg button{padding:6px 15px;border-radius:99px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:rgba(240,198,116,.18);color:var(--gold)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.card{--c:var(--gold);position:relative;padding:20px 21px 18px;border-radius:20px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);box-shadow:0 12px 34px rgba(0,0,0,.34);cursor:pointer;transition:.22s;overflow:hidden;display:flex;flex-direction:column;gap:11px;text-align:left}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--c),transparent 85%)}
.card::after{content:"";position:absolute;right:-60px;top:-60px;width:170px;height:170px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 22%,transparent),transparent);opacity:.7;pointer-events:none}
.card:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 18px 44px rgba(0,0,0,.45),0 0 0 1px rgba(240,198,116,.1)}
.card h3{font:700 25px/1.1 var(--serif);margin:0;color:var(--text);position:relative;z-index:1}
.card .row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;position:relative;z-index:1}
.card p{margin:0;color:var(--muted);font-size:14.5px;position:relative;z-index:1}
.card .method{font:italic 500 17px/1.35 var(--serif);color:#d9cde8}
.card .tools{position:absolute;right:12px;top:12px;display:none;gap:6px;z-index:3}
body.edit .card .tools{display:flex}
.iconbtn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(14,9,22,.78);border:1px solid var(--line2);color:var(--gold)}
.iconbtn:hover{background:var(--gold);color:#2a1a08}
.iconbtn.del:hover{background:var(--bad);color:#2a0c0c;border-color:var(--bad)}
.cardfoot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:6px;position:relative;z-index:1}
.addcard{border:1.5px dashed var(--line2);background:rgba(240,198,116,.03);display:none;align-items:center;justify-content:center;min-height:130px;color:var(--gold);font-weight:800;gap:10px;box-shadow:none}
.addcard::before,.addcard::after{display:none}
body.edit .addcard{display:flex}
.addcard:hover{background:rgba(240,198,116,.09)}

.badge{--c:var(--gold);display:inline-flex;align-items:center;gap:7px;padding:3px 11px 3px 9px;border-radius:99px;font:800 11.5px var(--sans);letter-spacing:.04em;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 38%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);white-space:nowrap}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 7px var(--c)}
.badge.lvl{--c:#c8b6e8}
.badge.plain{color:var(--muted);border-color:var(--line);background:rgba(255,255,255,.04)}
.gems{display:inline-flex;gap:3px}
.gems svg{width:12px;height:12px}

.chip{--c:var(--muted);display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:10px;font:700 13px var(--sans);color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);transition:.15s;cursor:pointer}
.chip:hover{border-color:var(--line2);background:rgba(240,198,116,.1)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 7px var(--c)}
.chip.craft{border-color:rgba(240,198,116,.3);background:rgba(240,198,116,.07)}
.chip.craft::after{content:"";width:6px;height:6px;background:var(--gold);transform:rotate(45deg);margin-left:1px}
.chip.bad{border:1px dashed var(--bad);color:var(--bad);background:rgba(229,133,133,.07)}
.chip .q{font-weight:800;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.lbl{font:800 10.5px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;display:block}
.price{display:inline-flex;align-items:center;gap:7px;font:700 22px var(--serif);color:var(--gold)}
.price .ico{color:var(--amber)}
.price small{font:700 12px var(--sans);color:var(--muted);margin-left:2px}
.moonchip{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font:700 12.5px var(--sans)}

/* overview */
.hero{position:relative;border-radius:28px;padding:44px 46px;border:1px solid var(--line2);overflow:hidden;background:
  radial-gradient(600px 300px at 85% 0%,rgba(240,198,116,.22),transparent 65%),
  linear-gradient(135deg,#2c1d42,#1a1228 60%,#150e20);box-shadow:0 24px 70px rgba(0,0,0,.5)}
.hero .bigmoon{position:absolute;right:46px;top:30px;width:150px;height:150px;opacity:.95;filter:drop-shadow(0 0 40px rgba(240,198,116,.5))}
.hero h1{font:700 clamp(44px,6vw,78px)/1 var(--serif);margin:12px 0 12px;background:linear-gradient(180deg,#fff3d6,#f0c674 70%,#d99a3e);-webkit-background-clip:text;background-clip:text;color:transparent;max-width:760px}
.hero p{max-width:620px;color:#cdbfe0;font-size:18px;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:22px}
.stat{padding:20px 22px;border-radius:20px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);display:flex;flex-direction:column;gap:3px;text-align:left;transition:.2s}
.stat:hover{transform:translateY(-3px);border-color:var(--line2)}
.stat .v{font:700 46px/1 var(--serif);color:var(--gold)}
.stat .k{font:800 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.stat .ico{color:var(--amber);margin-bottom:8px}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;position:relative;margin-top:6px}
.step{position:relative;padding:22px 18px 18px;border-radius:20px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line)}
.step .num{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 22px var(--serif);color:#2a1a08;background:linear-gradient(135deg,#f6d98c,#e8a33d);box-shadow:0 0 20px rgba(232,163,61,.45);margin-bottom:12px}
.step h4{font:700 22px/1.1 var(--serif);margin:0 0 6px}
.step .e{font-size:13px;color:var(--muted)}
.step .o{font-size:13.5px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);color:#dccfe9}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.zone{--c:var(--gold);padding:20px;border-radius:20px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);text-align:left;position:relative;overflow:hidden;transition:.2s;display:flex;flex-direction:column;gap:12px}
.zone:hover{transform:translateY(-3px);border-color:var(--line2)}
.zone::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--c),transparent)}
.zone h4{font:700 26px/1 var(--serif);margin:0;display:flex;align-items:baseline;gap:10px}
.zone h4 small{font:800 12px var(--sans);color:var(--c)}
.checks{display:grid;gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.check.ok{border-color:rgba(127,200,160,.3);background:rgba(127,200,160,.06);color:var(--ok)}
.check.warn{border-color:rgba(229,133,133,.3);background:rgba(229,133,133,.06)}
.check b{color:var(--text)}

/* table */
.tablewrap{border:1px solid var(--line);border-radius:20px;overflow:auto;background:linear-gradient(160deg,var(--card2),var(--card));box-shadow:0 12px 34px rgba(0,0,0,.34)}
table.t{width:100%;border-collapse:separate;border-spacing:0;min-width:820px}
.t th{position:sticky;top:0;text-align:left;padding:14px 16px;font:800 10.5px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);background:rgba(21,15,32,.96);border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
.t th.r,.t td.r{text-align:right}
.t th.on{color:var(--gold)}
.t td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr.band td{padding:18px 16px 9px;font:700 22px var(--serif);color:var(--gold);background:rgba(240,198,116,.045);border-bottom:1px solid var(--line2)}
.t tr.band td small{font:800 11px var(--sans);letter-spacing:.14em;color:var(--faint);text-transform:uppercase;margin-left:10px}
.t tr.item:hover td{background:rgba(240,198,116,.04)}
.t .nm{font:700 20px/1.15 var(--serif);cursor:pointer}
.t .nm:hover{color:var(--gold)}
.t .sub{font-size:13px;color:var(--faint);margin-top:3px;max-width:430px}
.t .sub b{color:var(--muted);font-weight:700}
.t td.p{font:700 19px var(--serif);text-align:right;font-variant-numeric:tabular-nums;color:var(--text);}
.t td.p.base{color:var(--gold)}
.t input.num{width:70px;text-align:right;background:rgba(14,9,22,.6);border:1px dashed var(--line2);border-radius:8px;padding:4px 8px;font:700 18px var(--serif);color:var(--gold)}
.dash{color:var(--faint)}

/* request card */
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 24px var(--serif);color:#2a1a08;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));flex:none;box-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent)}
.quote{font:italic 500 19px/1.4 var(--serif);color:#e6dcf3;position:relative;padding-left:16px;border-left:2px solid var(--c)}
.paybox{display:flex;gap:20px;padding:11px 14px;border-radius:14px;background:rgba(14,9,22,.45);border:1px solid var(--line)}
.paybox div{display:flex;flex-direction:column}
.paybox .v{font:700 24px/1.1 var(--serif);color:var(--gold)}
.paybox .v.w{color:var(--muted)}
.paybox .k{font:800 10px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}

/* rules */
.tiers{display:grid;gap:12px}
.tier{display:grid;grid-template-columns:150px 120px 1fr;gap:16px;align-items:center;padding:16px 20px;border-radius:18px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line)}
.tier h4{font:700 26px var(--serif);margin:0}
.tier .x{font:700 34px var(--serif);color:var(--gold);font-variant-numeric:tabular-nums}
.tier .x small{font:700 16px var(--sans);color:var(--muted)}
.tier .d{color:var(--muted)}
.tier input.num{width:100px;font:700 30px var(--serif);background:rgba(14,9,22,.6);border:1px dashed var(--line2);border-radius:10px;padding:2px 10px;color:var(--gold)}
.levels{display:grid;gap:12px}
.lv{display:grid;grid-template-columns:56px 200px 1fr 1fr;gap:18px;align-items:center;padding:16px 20px;border-radius:18px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line)}
.lv .num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 24px var(--serif);color:#2a1a08;background:linear-gradient(135deg,#f6d98c,#e8a33d)}
.lv h4{font:700 24px var(--serif);margin:0}
.lv small{display:block;font:800 10px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}

/* edit mode */
.editbar{display:none;align-items:center;gap:12px;margin:0 0 22px;padding:10px 16px;border-radius:14px;border:1px dashed var(--line2);background:rgba(240,198,116,.06);color:var(--gold);font-weight:700;font-size:14px}
body.edit .editbar{display:flex}
body.edit [data-edit]{outline:1px dashed rgba(240,198,116,.5);outline-offset:4px;border-radius:6px;cursor:text}
body.edit [data-edit]:focus{outline:2px solid var(--gold);background:rgba(240,198,116,.07)}
.only-edit{display:none!important}
body.edit .only-edit{display:inline-flex!important}
body.edit .hide-edit{display:none!important}

/* modal */
#overlay:empty{display:none}
.scrim{position:fixed;inset:0;z-index:100;background:rgba(8,5,14,.74);backdrop-filter:blur(7px);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;animation:fade .18s}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}

/* ---------- lookups ---------- */
let IDX=null;
function buildIdx(){
  IDX=new Map();
  D.gathers.forEach(g=>IDX.set(g.name.toLowerCase(),{type:'gather',e:g}));
  D.crafts.forEach(c=>IDX.set(c.name.toLowerCase(),{type:'craft',e:c}));
}
function resolve(name){
  const n=name.trim().toLowerCase();
  if(IDX.has(n))return IDX.get(n);
  if(n.endsWith('s')&&IDX.has(n.slice(0,-1)))return IDX.get(n.slice(0,-1));
  return null;
}
function parseIng(str){
  return String(str||'').split('+').map(s=>s.trim()).filter(Boolean).map(p=>{
    const m=p.match(/^(\d+)\s+(.+)$/);
    const qty=m?parseInt(m[1],10):1, name=m?m[2]:p;
    return {qty,name,r:resolve(name)};
  });
}
function serIng(list){return list.filter(x=>x.name.trim()).map(x=>(x.qty>1?x.qty+' ':'')+x.name.trim()).join(' + ');}
function lvLabel(n){const l=D.levels.find(x=>x.level==n);return l?`L${n} · ${l.name}`:`L${n}`;}
function lvName(n){const l=D.levels.find(x=>x.level==n);return l?l.name:'';}
function listColor(list,name){const x=(D.lists[list]||[]).find(i=>i.name===name);return x?x.color:'#a99bbd';}
function tierMult(name,fallbackIdx){const t=D.tiers.find(x=>x.name===name)||D.tiers[fallbackIdx];return t?Number(t.mult):1;}
const money=n=>Number.isFinite(n)?String(n):'–';
function priceAt(base,mult){return Math.round(Number(base||0)*Number(mult||0));}

function rawNeeds(entity,type,mult,stack,out,steps){
  out=out||new Map();steps=steps||new Map();stack=stack||[];
  if(type==='craft'){
    if(stack.includes(entity.id))return {out,steps};
    stack=stack.concat(entity.id);
  }
  parseIng(entity.ingredients||'').forEach(p=>{
    const q=p.qty*(mult||1);
    if(!p.r){out.set('?'+p.name,(out.get('?'+p.name)||0)+q);return;}
    if(p.r.type==='gather'){out.set(p.r.e.name,(out.get(p.r.e.name)||0)+q);}
    else{steps.set(p.r.e.name,(steps.get(p.r.e.name)||0)+q);rawNeeds(p.r.e,'craft',q,stack,out,steps);}
  });
  return {out,steps};
}
function requestNeeds(r){
  const out=new Map(),steps=new Map();
  parseIng(r.answer).forEach(p=>{
    if(!p.r)return;
    if(p.r.type==='craft'){
      const x=rawNeeds(p.r.e,'craft',p.qty);x.out.forEach((v,k)=>out.set(k,(out.get(k)||0)+v));
      x.steps.forEach((v,k)=>steps.set(k,(steps.get(k)||0)+v));}
    else out.set(p.r.e.name,(out.get(p.r.e.name)||0)+p.qty);
  });
  return {out,steps};
}
function usedIn(name){
  const n=name.toLowerCase();
  const hit=list=>list.filter(x=>parseIng(x.ingredients).some(p=>p.r&&p.r.e.name.toLowerCase()===n));
  return {crafts:hit(D.crafts),upgrades:hit(D.upgrades),
    requests:D.requests.filter(r=>parseIng(r.answer).some(p=>p.r&&p.r.e.name.toLowerCase()===n))};
}

function pgSearch(){
  const q=UI.q.trim().toLowerCase();
  const hit=(o,keys)=>keys.some(k=>String(o[k]||'').toLowerCase().includes(q));
  const g=D.gathers.filter(x=>hit(x,['name','latin','zone','lore','notes','source','when','corr']));
  const c=D.crafts.filter(x=>hit(x,['name','kind','purpose','ingredients','method','lore','notes','improper']));
  const r=D.requests.filter(x=>hit(x,['name','ask','answer','wrong','notes']));
  const u=D.upgrades.filter(x=>hit(x,['name','ingredients','notes','effect']));
  const row=(t,e,sub)=>`<button class="resrow" data-act="open" data-type="${t}" data-id="${e.id}"><b>${esc(e.name)}</b><span>${esc(sub)}</span></button>`;
  const grp=(title,arr)=>arr.length?`<h2 class="sec">${title} <span class="l"></span><small>${arr.length}</small></h2><div class="checks">${arr.join('')}</div>`:'';
  const n=g.length+c.length+r.length+u.length;
  return `<div class="pagehead"><div class="eyebrow">Search</div><h1 class="title">“${esc(UI.q)}”</h1><p class="blurb">${n} ${n===1?'match':'matches'} across the whole book.</p></div>`+
   grp('Gathering',g.map(e=>row('gather',e,e.zone+' · '+e.rarity)))+grp('Recipes & spells',c.map(e=>row('craft',e,e.kind+' · '+lvLabel(e.level)+' · '+e.ingredients)))+grp('Requests',r.map(e=>row('request',e,e.kind+' · '+e.ask)))+grp('Upgrades',u.map(e=>row('upgrade',e,e.ingredients)))+(n?'':'<div class="empty">Nothing found. Try a shorter word.</div>');
}

 request:[['name','Customer','text',{req:1}],['kind','Kind','list','reqkinds'],['level','Level','level'],['ask','What they say','area'],['answer','Right answer (recipes)','ing','crafts'],['pay','Pays, done right','num'],['wrong','If you give the wrong thing','area'],['notes','Notes','area']],

function field(type,def,val){
  const [k,label,t,opt]=def;
  let inner='';
  if(t==='text')inner=`<input type="text" data-f="${k}" value="${esc(val)}" ${opt&&opt.dl?`list="dl-${k}"`:''} autocomplete="off">${opt&&opt.dl?`<datalist id="dl-${k}">${opt.dl.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`;
  else if(t==='area')inner=`<textarea data-f="${k}">${esc(val)}</textarea>`;
  else if(t==='num')inner=`<input type="number" step="1" min="0" data-f="${k}" value="${val==null?'':val}">`;
  else if(t==='bool')return `<div class="fld"><label class="check-row"><input type="checkbox" data-f="${k}" ${val?'checked':''}> ${esc(label)}</label></div>`;
  else if(t==='level')inner=`<select data-f="${k}">${D.levels.map(l=>`<option value="${l.level}" ${String(val)===String(l.level)?'selected':''}>Level ${l.level} · ${esc(l.name)}</option>`).join('')}</select>`;
  else if(t==='list'){
    const items=D.lists[opt];
    inner=`<select data-f="${k}" data-list="${opt}" data-act-change="newcat">${items.map(i=>`<option ${i.name===val?'selected':''}>${esc(i.name)}</option>`).join('')}${val&&!items.find(i=>i.name===val)?`<option selected>${esc(val)}</option>`:''}<option value="__new__">+ New category…</option></select><input class="newcat" type="text" data-newcat="${k}" placeholder="Name the new category">`;
  }else if(t==='ing'){
    const rows=parseIng(val);if(!rows.length)rows.push({qty:1,name:''});
    inner=`<div class="ingp" data-f="${k}" data-src="${opt}">${rows.map(r=>ingRow(r,opt)).join('')}<button type="button" class="btn sm" data-act="ing-add" style="justify-self:start">${ico('plus',14)} Add ingredient</button></div><datalist id="dl-${opt}">${(opt==='crafts'?D.crafts:D.gathers.concat(D.crafts)).map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>`;
  }
  return `<div class="fld"><label>${esc(label)}</label>${inner}${opt&&opt.hint?`<div class="hint">${esc(opt.hint)}</div>`:''}<div class="err" data-err="${k}"></div></div>`;
}

function openForm(type,id,preset){

function collectForm(form){
  const out={};
  $$('[data-f]',form).forEach(el=>{
    const k=el.dataset.f;
    if(el.classList.contains('ingp')){
      out[k]=serIng($$('.ingrow',el).map(r=>{const i=$$('input',r);return {qty:Math.max(1,parseInt(i[0].value,10)||1),name:i[1].value};}));
    }else if(k==='level')out[k]=Number(el.value);
    else if(el.type==='checkbox')out[k]=el.checked;
    else if(el.tagName==='SELECT'&&el.value==='__new__'){
      const nv=$(`[data-newcat="${k}"]`,form).value.trim();out[k]=nv||null;out['__new_'+k]=nv;
    }else if(el.type==='number')out[k]=el.value===''?null:Number(el.value);
    else out[k]=el.value.trim();
  });
  return out;
}
function saveForm(form){
  const type=form.dataset.type,id=form.dataset.id;
  const v=collectForm(form);
  const errs={};
  if(!v.name)errs.name='A name is needed.';
  if(type==='gather'||type==='craft'){
    const clash=D.gathers.concat(D.crafts).find(x=>x.name.toLowerCase()===String(v.name||'').toLowerCase()&&x.id!==id);
    if(clash)errs.name='Something called “'+clash.name+'” already exists. Names must be unique so recipes can find them.';
  }
  $$('[data-err]',form).forEach(e=>e.textContent=errs[e.dataset.err]||'');
  if(Object.keys(errs).length)return;
  // new categories
  const listMap={zone:'zones',kind:type==='request'?'reqkinds':'kinds',moon:'moons',rarity:'rarities',accuracy:'accuracy'};
  const pal=['#4fb5a0','#c9a24a','#6c9bd8','#d98a5a','#b58be0','#e08fa0','#8bd3b0','#e6a86c','#9fb4e8','#f0c674'];
  Object.keys(listMap).forEach(k=>{
    if(v['__new_'+k]){const L=D.lists[listMap[k]];if(!L.find(i=>i.name===v['__new_'+k]))L.push({name:v['__new_'+k],color:pal[L.length%pal.length]});}
    delete v['__new_'+k];
  });
  const list={gather:D.gathers,craft:D.crafts,request:D.requests,upgrade:D.upgrades}[type];
  if(id){
    const e=list.find(x=>x.id===id);
    if((type==='gather'||type==='craft')&&e.name!==v.name)renameRefs(e.name,v.name);
    Object.assign(e,v);
  }else{
    const p={gather:'g-',craft:'c-',request:'r-',upgrade:'u-'}[type];
    list.push(Object.assign({id:uid(p)},v));
  }
  save();closeModal();render(true);
}
function renameRefs(oldN,newN){
  buildIdx();
  const target=resolve(oldN);if(!target)return;
  const fix=str=>serIng(parseIng(str).map(p=>({qty:p.qty,name:(p.r&&p.r.e===target.e)?newN:p.name})));
  D.crafts.forEach(c=>c.ingredients=fix(c.ingredients));
  D.upgrades.forEach(c=>c.ingredients=fix(c.ingredients));
  D.requests.forEach(r=>r.answer=fix(r.answer));
}
function confirmDelete(type,id){
  const list={gather:D.gathers,craft:D.crafts,request:D.requests,upgrade:D.upgrades}[type];

}

const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  files.forEach(f=>{
    const name=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(33),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(lh,name,data);
    cd.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(33),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=lh.length+name.length+data.length;
  });
  let cdSize=0;cd.forEach(c=>cdSize+=c.length);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  return new Blob([...parts,...cd,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

const colL=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;};

const node=id=>AS.tree.find(n=>n.id===id);
const kids=p=>AS.tree.filter(n=>(n.parent||null)===(p||null)).sort((a,b)=>a.order-b.order);

  const areaIds=new Set(gp?kids(gp.id).filter(f=>f.type==='folder'&&['Marsh','Garden and hedgerow','Woods','Canal and shore','Town','Reward','Other'].includes(f.name)).map(f=>f.id):[]);
  itDefs().filter(d=>d.link).forEach(d=>{let aid=AS.slots['item_'+d.key],n=aid&&node(aid);
    const real=AS.tree.find(x=>x.type==='asset'&&!x.ph&&areaIds.has(x.parent)&&x.name.toLowerCase()===d.label.toLowerCase());
    if(real&&(!n||n.ph)){if(n&&n.ph)AS.tree=AS.tree.filter(x=>x.id!==n.id&&x.to!==n.id);AS.slots['item_'+d.key]=real.id;n=real;}
    if(!n)return;
    if(areaIds.has(n.parent)){const par=ensureFolder(d.folder);n.parent=par;n.order=nextOrder(par);moved++;}
    const want=ensureFolder(d.folder);if(n.parent===want)moved+=linkTo(n.id,d.link);});
  areaIds.forEach(id=>{if(!kids(id).length)AS.tree=AS.tree.filter(x=>x.id!==id);});return moved;}
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const IT={q:'',target:null};
function itDefs(){

  D.crafts.forEach(c=>o.push({key:c.id,label:c.name,sub:'Level '+c.level+(c.sells===false?' · not sold':''),grp:['Crafted goods',c.kind||'Other']}));

async function itFile(d,f){

  const par=ensureFolder(d.folder||['Items'].concat(d.grp));
  await dbPut('files',id,f);mark(id);AS.urls[id]=url;AS.tree.push({id,type:'asset',name:d.fname||d.label,ext,parent:par,order:nextOrder(par),size:f.size,w,h});itLinks(d,id);
  itSet(d.key,id);toast('Added art for '+d.label);
}
async function itLink(d,url,quiet){

  const ext=((url.split('?')[0].match(/\.(png|jpe?g|webp|gif|svg|avif)$/i)||[])[1]||'png').toLowerCase(),id=uid(),par=ensureFolder(d.folder||['Items'].concat(d.grp));
  AS.urls[id]=url;AS.tree.push({id,type:'asset',name:d.fname||d.label,ext,parent:par,order:nextOrder(par),size:0,w,h,url});itLinks(d,id);
  itSet(d.key,id);if(!quiet)toast('Linked art for '+d.label);return true;
}

async function runBulkUrl(){
  const out=document.getElementById('bu-out'),log=(ok,t)=>{out.insertAdjacentHTML('beforeend',`<div style="color:${ok?'#8bd3b0':'#e58585'}">${ok?'✓':'✗'} ${esc(t)}</div>`);};
  out.innerHTML='';const defs=itDefs();let ok=0,bad=0;

  const find=nm=>{const g=slug(nm);return defs.find(d=>d.key===nm||d.key==='x_'+g||slug(d.label)===g||(d.fname&&slug(d.fname)===g)||d.key===g);};
  if(base){const b=base.endsWith('/')?base:base+'/';const jobs=defs.filter(d=>d.fname&&/^Azlynn/.test(d.fname));let n=0;
    for(const d of jobs){const r=await itLink(d,b+slug(d.fname)+'.png',true);n++;if(r){ok++;log(true,d.fname);}}
    log(ok>0,ok?ok+' sprite frames found in that folder.':'No azlynn_… PNGs were found at that folder address. Check the link and that the files are public.');}

function paintShape(c,s){c.save();c.globalCompositeOperation=s.t==='erase'?'destination-out':'source-over';c.fillStyle=c.strokeStyle='#fff';c.lineCap=c.lineJoin='round';const P=s.pts||[];
  if((s.t==='brush'||s.t==='erase'||s.t==='wall')&&P.length){c.lineWidth=s.t==='wall'?s.w:s.r*2;c.beginPath();if(P.length===1){c.arc(P[0][0],P[0][1],c.lineWidth/2,0,7);c.fill();}else{c.moveTo(P[0][0],P[0][1]);for(let i=1;i<P.length;i++)c.lineTo(P[i][0],P[i][1]);c.stroke();}}

function drawWalk(){

  if(d&&d.pts&&d.pts.length&&(d.tool==='wall'||d.tool==='poly')){c.font='bold 34px sans-serif';c.textAlign='left';const msg='Right-click, press Enter, or press Finish to end';const w=c.measureText(msg).width;c.fillStyle='rgba(0,0,0,.7)';c.fillRect(16,16,w+28,56);c.fillStyle='#ffd98a';c.fillText(msg,30,54);}

function finishDraft(){const d=AS.draft;if(!d)return;const sc=AS.scenes[AS.scene],W_=wl(sc);if(AS.wmode==='ctr')W_.length=0;
  if(d.tool==='wall'&&d.pts.length>=2)W_.push({t:'wall',pts:d.pts,w:AS.walkW});else if(d.tool==='poly'&&d.pts.length>=3)W_.push({t:'poly',pts:d.pts});
  AS.draft=null;saveMeta();drawWalk();const rp=document.getElementById('am-right');if(rp)rp.innerHTML=amLayers(AS.scene);}
document.addEventListener('pointerdown',e=>{
  if(e.target.id!=='am-walk'||!AS.walk)return;e.preventDefault();const sc=AS.scenes[AS.scene],p=wpt(e),T=AS.wtool,cv=e.target;
  if(T==='start'){sc.spawn={x:p[0],y:p[1]};saveMeta();drawWalk();return;}
  if(T==='wall'||T==='poly'){const d=AS.draft&&AS.draft.tool===T?AS.draft:(AS.draft={tool:T,pts:[]});
    if(T==='poly'&&d.pts.length>=3&&Math.hypot(p[0]-d.pts[0][0],p[1]-d.pts[0][1])<24){finishDraft();return;}
    const now=Date.now(),l=d.pts[d.pts.length-1];
    if(d.pts.length>=2&&AS._lp&&now-AS._lt<380&&Math.hypot(p[0]-AS._lp[0],p[1]-AS._lp[1])<14){finishDraft();AS._lp=null;return;}
    if(!l||Math.hypot(p[0]-l[0],p[1]-l[1])>6)d.pts.push(p);AS._lt=now;AS._lp=p;drawWalk();return;}
  if(T==='rect'){AS.draft={tool:'rect',x0:p[0],y0:p[1],rect:null,pts:[]};}
  else AS.draft={tool:T,pts:[p]};
  cv.setPointerCapture(e.pointerId);drawWalk();
});
document.addEventListener('pointermove',e=>{
  if(e.target.id!=='am-walk'||!AS.walk||!AS.draft)return;const d=AS.draft,p=wpt(e);
  if(d.tool==='wall'||d.tool==='poly'){d.cursor=p;drawWalk();return;}
  if(!(e.buttons&1))return;
  if(d.tool==='rect'){d.rect={x:Math.min(d.x0,p[0]),y:Math.min(d.y0,p[1]),w:Math.abs(p[0]-d.x0),h:Math.abs(p[1]-d.y0)};}
  else{const l=d.pts[d.pts.length-1];if(!l||Math.hypot(p[0]-l[0],p[1]-l[1])>Math.max(5,AS.walkSize/4))d.pts.push(p);}
  drawWalk();
});
document.addEventListener('pointerup',e=>{
  const d=AS.draft;if(!AS.walk||!d||d.tool==='wall'||d.tool==='poly')return;const sc=AS.scenes[AS.scene],W_=wl(sc);
  if(d.tool==='rect'){if(d.rect&&d.rect.w>8&&d.rect.h>8)W_.push(Object.assign({t:'rect'},d.rect));}
  else if(d.pts.length)W_.push({t:d.tool==='eraser'?'erase':'brush',r:AS.walkSize,pts:d.pts});
  AS.draft=null;saveMeta();drawWalk();const rp=document.getElementById('am-right');if(rp)rp.innerHTML=amLayers(AS.scene);
});

/* visible pencil cursor: a ring the size of the brush follows the pointer */
function walkCursor(e){
  const cv=document.getElementById('am-walk');if(!cv)return;let r=document.getElementById('am-cur');
  if(!r){r=document.createElement('div');r.id='am-cur';cv.parentElement.appendChild(r);}
  if(!AS.walk||e.type==='pointerleave'){r.style.display='none';return;}
  const b=cv.getBoundingClientRect(),k=b.width/cv.width,T=AS.wtool,stage=cv.parentElement.getBoundingClientRect();
  const D=T==='pencil'||T==='eraser'?(AS.walkSize||30)*2:T==='wall'?(AS.walkW||16):0,sz=Math.max(D*k,14);
  r.className=T==='eraser'?'er':T==='start'?'st':'';r.style.cssText=`display:block;left:${e.clientX-stage.left}px;top:${e.clientY-stage.top}px;width:${sz}px;height:${sz}px`;
  cv.style.cursor='none';
}
document.addEventListener('pointermove',e=>{if(e.target.id==='am-walk')walkCursor(e);});
document.addEventListener('pointerout',e=>{if(e.target.id==='am-walk'){const r=document.getElementById('am-cur');if(r)r.style.display='none';}});
document.addEventListener('keydown',e=>{if(!AS.walk||!document.getElementById('am-walk'))return;if(e.key==='Enter'){finishDraft();}
  else if(e.key==='Escape'){AS.draft=null;drawWalk();}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){const sc=AS.scenes[AS.scene];if(wl(sc).length){wl(sc).pop();saveMeta();drawWalk();}e.preventDefault();}});

  const ly=e.target.closest&&e.target.closest('#am-st .ly');if(!ly)return;e.preventDefault();
  const sc=AS.scenes[AS.scene],L=sc.layers.find(l=>l.id===ly.dataset.lid);if(!L)return;
  if(AS.layer!==L.id){AS.layer=L.id;document.querySelectorAll('#am-st .ly.sel').forEach(x=>x.classList.remove('sel'));ly.classList.add('sel');const rp=document.getElementById('am-right');if(rp)rp.innerHTML=amLayers(AS.scene);}
  const k=+document.getElementById('am-st').dataset.k||1,sx=e.clientX,sy=e.clientY,ox=L.x,oy=L.y;let moved=false;
  const mv=ev=>{moved=true;L.x=Math.round(ox+(ev.clientX-sx)/k);L.y=Math.round(oy+(ev.clientY-sy)/k);ly.style.left=L.x+'px';ly.style.top=L.y+'px';};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);if(moved){saveMeta();document.querySelectorAll('[data-lp=x]').forEach(o=>o.value=L.x);document.querySelectorAll('[data-lp=y]').forEach(o=>o.value=L.y);}};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
});
document.addEventListener('keydown',e=>{const a=document.getElementById('asm');if(!a||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const l=curLayer();if(!l)return;const st=e.shiftKey?10:1;
  if(e.key==='ArrowLeft'){l.x-=st;}else if(e.key==='ArrowRight'){l.x+=st;}else if(e.key==='ArrowUp'){l.y-=st;}else if(e.key==='ArrowDown'){l.y+=st;}else if(e.key==='Delete'||e.key==='Backspace'){const sc=AS.scenes[AS.scene];sc.layers=sc.layers.filter(x=>x.id!==l.id);AS.layer=null;saveMeta();amRender();return;}else return;
  e.preventDefault();stageRefresh();saveSoon();});

/* ----- background remover ----- */
function openCutout(){
  const n=node(AS.sel);if(!n)return;const m=document.createElement('div');m.id='am-cut';m.className='scrim';m.style.zIndex=300;
  m.innerHTML=`<div class="modal" style="width:min(900px,96vw)"><h2>Remove background</h2><div class="note" style="margin:6px 0">Picks the colour in the corners and makes it transparent. Works best on a plain flat background (white, black, or bright green).</div>
  <div class="fld"><label>Strength <span id="cutv">40</span></label><input type="range" id="cutt" min="5" max="140" value="40"></div>
  <label class="chip"><input type="checkbox" id="cutall"> also remove matching colour inside the picture</label>
  <div style="margin:12px 0;max-height:52vh;overflow:auto;background:repeating-conic-gradient(#2a2038 0 25%,#1c1428 0 50%) 0 0/24px 24px;border-radius:12px;text-align:center"><canvas id="cutc" style="max-width:100%"></canvas></div>
  <div class="actions"><button class="btn gold" id="cutok">Apply</button><button class="btn" id="cutno">Cancel</button></div></div>`;
  document.body.appendChild(m);
  const im=new Image();im.onload=()=>{const c=document.getElementById('cutc'),x=c.getContext('2d',{willReadFrequently:true});c.width=im.naturalWidth;c.height=im.naturalHeight;x.drawImage(im,0,0);const src=x.getImageData(0,0,c.width,c.height);
    const run=()=>{const tol=+document.getElementById('cutt').value,all=document.getElementById('cutall').checked;document.getElementById('cutv').textContent=tol;const W=c.width,H=c.height,d=new Uint8ClampedArray(src.data),px=(i)=>[d[i*4],d[i*4+1],d[i*4+2]];
      const cs=[0,W-1,(H-1)*W,H*W-1].map(px),bc=[0,1,2].map(k=>Math.round(cs.reduce((a,v)=>a+v[k],0)/4));
      const near=i=>Math.hypot(d[i*4]-bc[0],d[i*4+1]-bc[1],d[i*4+2]-bc[2])<=tol;
      if(all){for(let i=0;i<W*H;i++)if(near(i))d[i*4+3]=0;}
      else{const seen=new Uint8Array(W*H),q=[];const push=i=>{if(!seen[i]&&near(i)){seen[i]=1;q.push(i);}};for(let x2=0;x2<W;x2++){push(x2);push((H-1)*W+x2);}for(let y=0;y<H;y++){push(y*W);push(y*W+W-1);}
        while(q.length){const i=q.pop(),x2=i%W,y=(i/W)|0;d[i*4+3]=0;if(x2>0)push(i-1);if(x2<W-1)push(i+1);if(y>0)push(i-W);if(y<H-1)push(i+W);}}
      x.putImageData(new ImageData(d,W,H),0,0);};
    document.getElementById('cutt').oninput=run;document.getElementById('cutall').onchange=run;run();
    document.getElementById('cutno').onclick=()=>m.remove();
    document.getElementById('cutok').onclick=()=>{c.toBlob(async b=>{await dbPut('files',n.id,b);mark(n.id);AS.urls[n.id]=URL.createObjectURL(b);n.ext='png';n.size=b.size;n.w=c.width;n.h=c.height;await saveMeta();m.remove();stageRefresh();amRender();toast('Background removed');},'image/png');};};
  im.src=AS.urls[n.id];
}

/* ----- export zip for GitHub ----- */
const CRCT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crcb=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
function zipBin(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  files.forEach(f=>{const nm=enc.encode(f.name),d=f.data,c=crcb(d);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(33),...u32(c),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,d);cd.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(33),...u32(c),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);off+=lh.length+nm.length+d.length;});
  let cs=0;cd.forEach(c=>cs+=c.length);const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);
  return new Blob([...parts,...cd,end],{type:'application/zip'});
}
async function exportAssets(){
  const safe=s=>String(s).replace(/[^\w\- .]+/g,'_').trim()||'x',used=new Set(),files=[],tree=[];
  const pathOf=n=>{const seg=[];let c=n;while(c){seg.unshift(safe(c.name));c=c.parent?node(c.parent):null;}return seg.join('/');};
  for(const n of AS.tree){const o=Object.assign({},n);if(n.type==='asset'){let p=pathOf(n)+'.'+n.ext,i=1;while(used.has(p.toLowerCase()))p=pathOf(n)+'-'+(i++)+'.'+n.ext;used.add(p.toLowerCase());o.path=p;const b=n.url?null:await dbGet('files',n.id);if(b)files.push({name:'assets/'+p,data:new Uint8Array(await b.arrayBuffer())});}tree.push(o);}
  files.unshift({name:'assets/manifest.json',data:new TextEncoder().encode(JSON.stringify({v:1,tree,scenes:AS.scenes,slots:AS.slots},null,1))});
  const l=document.createElement('a');l.href=URL.createObjectURL(zipBin(files));l.download='night-market-assets.zip';l.click();toast('Unzip next to your index.html (it makes an “assets” folder)');
}

return {mount,load:assetsLoad,AS,render:amRender,sync:()=>{if(cloudOn())syncUp();}};
})();
